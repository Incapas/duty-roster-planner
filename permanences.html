<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- POLITIQUE DE SÉCURITÉ DU CONTENU (CSP), appliquée par le navigateur lui-même. -->
<!--   default-src 'none' ........... tout ce qui n'est pas autorisé ci-après est interdit -->
<!--                                  (polices, médias, cadres, workers, ressources externes). -->
<!--   script-src 'unsafe-inline' ... seuls les scripts écrits dans ce fichier s'exécutent ; aucun script externe. -->
<!--                                  eval() et new Function() restent interdits (pas de 'unsafe-eval'). -->
<!--   style-src 'unsafe-inline' .... seuls les styles écrits dans ce fichier. -->
<!--   img-src data: ................ aucune image distante. -->
<!--   connect-src 'none' ........... aucune connexion réseau possible depuis le script. -->
<!--   form-action 'none' ........... aucun envoi de formulaire. -->
<!--   base-uri 'none' .............. l'adresse de base de la page ne peut pas être détournée. -->
<!-- Point d'attention : 'unsafe-inline' est imposé par l'absence de serveur (pas de nonce possible). -->
<!-- La CSP ne bloquerait donc pas un script injecté dans la page : la protection contre l'injection -->
<!-- repose sur l'échappement systématique par esc() (voir le script Interface). -->
<!-- Une CSP posée par balise meta ne contrôle pas la navigation : le code ne contient ni lien ni redirection. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<!-- ===================================================================================== -->
<!-- PERMANENCES DU WEEK-END : guide de lecture pour un audit technique -->
<!-- ===================================================================================== -->
<!-- NATURE -->
<!--   Page HTML autonome. Aucun serveur, aucune dépendance externe, aucune requête réseau. -->
<!--   Elle lit et écrit deux fichiers dans un dossier choisi par l'utilisateur (API File System Access). -->
<!--  -->
<!-- STRUCTURE DU FICHIER -->
<!--   1. head : politique de sécurité (CSP), script de thème, feuille de style. -->
<!--   2. body : deux conteneurs vides (#app et #zone-impression), remplis par le script. -->
<!--   3. Script « Core », entre les repères CORE-DEBUT et CORE-FIN : logique métier pure, sans accès à l'écran. -->
<!--   4. Script « Interface » : état, rendu, événements, accès au dossier, impression. -->
<!--  -->
<!-- FLUX DE DONNÉES -->
<!--   Entrées : permanences-donnees.json et permanences.log (dossier choisi) ; saisies de l'utilisateur. -->
<!--   Sorties : ces deux mêmes fichiers ; impression ; téléchargement local d'une sauvegarde JSON. -->
<!--   Aucune autre sortie : ni fetch, ni XMLHttpRequest, ni WebSocket, ni formulaire, ni lien, -->
<!--   ni balise chargeant une ressource (img, iframe, link, script src). -->
<!--  -->
<!-- STOCKAGE SUR LE POSTE -->
<!--   IndexedDB : le lien vers le dossier. localStorage : trois préférences d'affichage. -->
<!--   Aucune donnée de planning n'est conservée sur le poste. -->
<!--  -->
<!-- POINTS DE CONTRÔLE -->
<!--   CSP ............................ balise meta ci-dessus. -->
<!--   Échappement HTML ............... fonction esc() ; toute donnée lue ou saisie y passe avant innerHTML. -->
<!--   Validation des données lues .... Core.normalize(). -->
<!--   Écritures concurrentes ......... Core.Store. -->
<!--   Accès aux fichiers ............. fileIo(), openFolder(), connect(). -->
<!--   Journal ........................ Core.logLine(), appendToLog(). -->
<!--  -->
<!-- LIMITES ASSUMÉES -->
<!--   Pas d'authentification : l'interrupteur « Administration » est un filtre d'affichage. -->
<!--   Pas d'identité : chacun choisit son nom dans une liste ; le journal n'enregistre que le rôle. -->
<!--   Pas de chiffrement : les deux fichiers sont en clair. -->
<!--   Le contrôle d'accès est celui du dossier partagé (droits Windows). -->
<!--  -->
<!-- CONVENTION -->
<!--   Les commentaires d'audit sont des lignes entières. Ils ne modifient aucune instruction. -->
<!-- ===================================================================================== -->
<title>Permanences du week-end</title>
<!-- SCRIPT 1 / 3 : thème. Lit une seule clé de localStorage (permanences.theme) et pose l'attribut -->
<!-- data-theme sur la balise html. Aucune donnée métier. Placé ici pour agir avant le premier affichage. -->
<script>/* Thème choisi (clair / sombre), appliqué avant l’affichage pour éviter un flash */try{const t=JSON.parse(localStorage.getItem('permanences.theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<!-- FEUILLE DE STYLE. Entièrement locale : ni url(), ni @import, ni police distante. -->
<!-- Les couleurs sont des variables définies sur :root, redéfinies pour le thème sombre. -->
<!-- Le bloc « @media print » en fin de feuille règle l'impression et l'export PDF. -->
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eef0f4;
  --text:#1b1f2a; --muted:#5f6878; --faint:#8a92a3; --border:#e3e6ec; --border-strong:#cdd2db;
  --accent:#0f6cbd; --accent-hover:#0b5aa0; --on-accent:#ffffff; --accent-soft:#e7f0fa; --accent-text:#0d5fa8;
  --danger:#c42b1c; --danger-soft:#fdeceb; --ok:#107c41; --ok-soft:#e4f3ea; --warn:#8f5600; --warn-soft:#fff3d1;
  --holiday:#7a3db8; --holiday-soft:#f2eafb;
  --shadow-sm:0 1px 2px rgba(17,24,39,.05),0 1px 3px rgba(17,24,39,.06);
  --shadow-md:0 6px 18px rgba(17,24,39,.08),0 1px 3px rgba(17,24,39,.06);
  --r-sm:6px; --r:10px; --r-lg:14px;
  --av-s:62%; --av-bg:91%; --av-fg:30%;
}
/* Thème : automatique (réglage de Windows), ou forcé clair / sombre via data-theme sur <html>. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131519; --surface:#1c1f26; --surface-2:#22262e; --surface-3:#2a2e37;
    --text:#e8eaef; --muted:#a2aab9; --faint:#7d8596; --border:#2e323c; --border-strong:#434956;
    --accent:#479ef5; --accent-hover:#65aef6; --on-accent:#081726; --accent-soft:rgba(71,158,245,.15); --accent-text:#7ebbf7;
    --danger:#ff8f80; --danger-soft:rgba(255,110,92,.14); --ok:#6dd197; --ok-soft:rgba(109,209,151,.13); --warn:#f0c35a; --warn-soft:rgba(240,195,90,.13);
    --holiday:#caa3f5; --holiday-soft:rgba(202,163,245,.14);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 22px rgba(0,0,0,.4);
    --av-s:38%; --av-bg:27%; --av-fg:85%;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131519; --surface:#1c1f26; --surface-2:#22262e; --surface-3:#2a2e37;
  --text:#e8eaef; --muted:#a2aab9; --faint:#7d8596; --border:#2e323c; --border-strong:#434956;
  --accent:#479ef5; --accent-hover:#65aef6; --on-accent:#081726; --accent-soft:rgba(71,158,245,.15); --accent-text:#7ebbf7;
  --danger:#ff8f80; --danger-soft:rgba(255,110,92,.14); --ok:#6dd197; --ok-soft:rgba(109,209,151,.13); --warn:#f0c35a; --warn-soft:rgba(240,195,90,.13);
  --holiday:#caa3f5; --holiday-soft:rgba(202,163,245,.14);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 22px rgba(0,0,0,.4);
  --av-s:38%; --av-bg:27%; --av-fg:85%;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:1.2rem;margin:0;font-weight:650;line-height:1.25}
h2{font-size:1.25rem;margin:0;font-weight:650}
h3{font-size:.8rem;margin:1.6rem 0 .6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
p{margin:.35rem 0}
code{background:var(--surface-3);padding:.08rem .35rem;border-radius:4px;font-size:.88em}
.ico{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.container{max-width:1120px;margin:0 auto;padding:0 16px 48px}
.help{color:var(--muted);font-size:.9rem}
.print-only{display:none}

/* Barre du haut */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--border)}
.bar-inner{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#7a3db8));color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.logo .ico{width:21px;height:21px}
.sub-title{color:var(--muted);font-size:.82rem}
.bar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.88rem;font-weight:550;user-select:none;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:38px;height:22px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
/* Choix du thème (auto / clair / sombre) */
.theme-choice{display:inline-flex;gap:2px;padding:3px;background:var(--surface-3);border-radius:9px}
.theme-choice button{display:inline-grid;place-items:center;width:30px;height:26px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer}
.theme-choice button:hover{color:var(--text)}
.theme-choice button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.theme-choice .ico{width:16px;height:16px}
.home-theme{display:flex;justify-content:flex-end;margin:-40px 0 16px}
/* Navigation par année */
.nav-year{display:inline-flex;align-items:center;gap:4px}
.nav-year .btn{padding:.38rem .45rem}
.nav-year select{padding:.36rem .5rem;font-weight:650;font-variant-numeric:tabular-nums}
.bar-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 4px}

/* Avatars et puces */
.avatar{--h:210;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;letter-spacing:.02em;flex:none;background:hsl(var(--h) var(--av-s) var(--av-bg));color:hsl(var(--h) 55% var(--av-fg))}
.avatar.large{width:36px;height:36px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;font-weight:550;white-space:nowrap}
.chip .avatar{width:24px;height:24px;font-size:.66rem}
.chip.alert{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem .9rem}

/* Ligne d'état */
.state{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem 1rem;font-size:.84rem;color:var(--muted);padding:12px 0 4px}
.state-file{display:inline-flex;gap:.35rem;align-items:center}
.state-file .ico{width:15px;height:15px}
.state-file{flex-wrap:wrap;min-width:0}
.state-file b{color:var(--text);font-weight:600;overflow-wrap:anywhere}
.state-file>span{color:var(--faint)}
.status{display:inline-flex;align-items:center;gap:.4rem}
.status::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status:empty::before{display:none}
/* Ligne d'état : hauteur fixe et texte sur une seule ligne, pour que la page ne bouge pas quand le message change */
.state>.status{display:block;flex:1 1 12rem;min-width:0;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state>.status::before{display:inline-block;margin-right:.4rem;vertical-align:1px}
.state>.status:empty::before{display:none}
.status-ok{color:var(--ok)} .status-ok::before{background:var(--ok)}
.status-info{color:var(--accent-text)} .status-info::before{background:var(--accent)}
.status-error{color:var(--danger);font-weight:600} .status-error::before{background:var(--danger)}
.state-links{display:inline-flex;gap:.9rem;margin-left:auto}
.link{display:inline-flex;align-items:center;gap:.3rem;background:none;border:0;padding:0;color:var(--accent-text);cursor:pointer;font-size:inherit;font-weight:550}
.link:hover{text-decoration:underline}
.link .ico{width:14px;height:14px}

/* Onglets */
nav.tabs{margin:10px 0 20px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabs-inner{display:inline-flex;gap:2px;padding:4px;background:var(--surface-3);border-radius:12px;min-width:max-content}
.tabs button{display:inline-flex;align-items:center;gap:.45rem;border:0;background:none;padding:.5rem .9rem;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:550;font-size:.92rem;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.tabs button[aria-current="page"] .ico{color:var(--accent)}
.tabs .sep{width:1px;background:var(--border-strong);margin:6px 4px}

/* Cartes, sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card>h2{font-size:1.02rem;margin-bottom:.8rem}
.head-section{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 0 16px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.state-empty{text-align:center;padding:40px 20px}
.state-empty .ico{width:40px;height:40px;color:var(--faint);margin-bottom:8px}
.state-empty b{display:block;font-size:1.05rem;margin-bottom:.2rem}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid transparent;padding:.55rem 1rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem;line-height:1.2;transition:background .12s,border-color .12s,box-shadow .12s}
.btn .ico{width:17px;height:17px}
.btn-pri{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-sm)}
.btn-pri:hover{background:var(--accent-hover)}
.btn-sec{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-sec:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:color-mix(in srgb,var(--danger) 45%,var(--border));color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-subtle{background:none;color:var(--muted);padding:.45rem .7rem}
.btn-subtle:hover{background:var(--surface-3);color:var(--text)}
.btn-small{padding:.32rem .65rem;font-size:.84rem;font-weight:550}
.btn-small .ico{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}

/* Bandeaux */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;margin:0 0 16px;border:1px solid;font-size:.92rem}
.banner>.ico{margin-top:2px}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
.banner.info>.ico{color:var(--accent)}
.banner.caution{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.caution>.ico{color:var(--warn)}
.banner.error{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.banner.error>.ico{color:var(--danger)}

/* Étiquettes */
.tag{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;line-height:1.3;padding:.12rem .5rem;border-radius:999px;font-weight:650;white-space:nowrap}
.tag-holiday{background:var(--holiday-soft);color:var(--holiday)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-danger{background:var(--danger-soft);color:var(--danger)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-accent{background:var(--accent-soft);color:var(--accent-text)}
.tag-grey{background:var(--surface-3);color:var(--muted)}

/* Formulaires */
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--border-strong);border-radius:8px;padding:.5rem .65rem;background:var(--surface);max-width:100%;transition:border-color .12s,box-shadow .12s}
input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:7rem;resize:vertical}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 1.2rem;align-items:end}
.field{display:flex;flex-direction:column;align-items:stretch;gap:.35rem;margin-bottom:.9rem;min-width:0}
.field>span{font-weight:600;font-size:.88rem}
.row-switch{display:flex;gap:.8rem;align-items:center;padding:.8rem 0;border-top:1px solid var(--border);margin-top:.2rem}

/* Saisie */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center}
.lbl{display:block;font-size:.8rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
#choice-employee{font-size:1.05rem;font-weight:600;width:min(320px,100%);padding:.6rem .8rem;text-overflow:ellipsis}
/* Compteurs de taille fixe : ne bougent pas quand les chiffres ou les libellés changent */
.stats{display:grid;grid-template-columns:repeat(3,116px);gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;height:72px;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.stat-v{font-size:1.5rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-l{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.danger .stat-v{color:var(--danger)} .stat.ok .stat-v{color:var(--ok)} .stat.accent .stat-v{color:var(--accent-text)}
.grid-we{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;box-shadow:var(--shadow-sm);transition:transform .1s,box-shadow .12s,border-color .12s,background .12s}
.tile:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.tile-days{font-size:1.3rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile-month{display:block;font-size:.78rem;color:var(--muted);font-weight:550}
.tile-state{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);flex:none}
.tile-state .ico{width:15px;height:15px;stroke-width:2.4}
.tile-label{font-size:.84rem;font-weight:600;color:var(--ok)}
.tile{min-width:0}
.tile-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;min-width:0}
/* Les étiquettes longues passent à la ligne au lieu de déborder de la carte */
.tile-tags .tag{white-space:normal;max-width:100%;border-radius:8px;line-height:1.25;overflow-wrap:anywhere}
.tile-top>span:first-child{min-width:0}
.tile-month{overflow-wrap:anywhere}
.tile[aria-pressed="true"]{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.tile[aria-pressed="true"] .tile-state{background:var(--danger);color:var(--surface)}
.tile[aria-pressed="true"] .tile-label{color:var(--danger)}
.tile .tag-danger{background:var(--danger);color:var(--surface)}
.tile:disabled{cursor:default;opacity:.55;box-shadow:none;transform:none}

/* Tableaux */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--border);padding:.55rem .7rem;text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
thead th{background:var(--surface-2);font-weight:650;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;z-index:1}
tr.month-row th{background:var(--surface);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text);font-weight:700;padding-top:1rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.center,td.center{text-align:center}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.we-cell{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.we-label{font-weight:600;white-space:nowrap}
