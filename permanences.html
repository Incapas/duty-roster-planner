<body>
<!-- #app : conteneur de l'application. Son contenu est entièrement reconstruit par render() à chaque changement d'état. -->
<div id="app"><div class="home"><p>Chargement…</p></div></div>
<!-- #zone-impression : invisible à l'écran. Reçoit les fiches individuelles le temps d'une impression, puis est vidée. -->
<div id="print-area" aria-hidden="true"></div>
<noscript><p style="padding:16px">Cette page nécessite JavaScript.</p></noscript>

<script>
// SCRIPT 2 / 3 : Core, la logique métier.
/*CORE-DEBUT*/
/* Logique métier indépendante de l'interface : dates, fériés, données, répartition, synchronisation. */
// =====================================================================================
// MODULE Core
// =====================================================================================
// Fonction auto-exécutée : tout ce qu'elle déclare est privé, sauf l'objet retourné en fin de module.
// Core n'accède ni au document, ni aux fichiers, ni au stockage du navigateur. Il n'utilise que
// Date, JSON, Math, Promise et setTimeout. Les accès aux fichiers lui sont fournis par l'interface
// sous la forme d'un objet io = { read(), write(texte) } : voir Store.
// Conséquence pour l'audit : toute règle métier se lit et se teste ici, hors navigateur.
//
// Sommaire : dates . jours fériés . week-ends et poids . données . journal . opérations .
//            synchronisation (Store) . répartition (propose) . analyse (analyze).
const Core = (function(){
  'use strict';
  const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const SHORT_MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  const SHORT_DAYS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  const FORMAT = 'permanences-weekend';

  // ----- Dates -----
  // Convention : une date est une chaîne 'AAAA-MM-JJ'. Les calculs se font en UTC pour qu'un changement
  // d'heure ne décale jamais un jour. Deux dates au même format se comparent comme des chaînes.
  // parseISO : chaîne vers Date (minuit UTC).   toISO : Date vers chaîne.   addDays : décalage de n jours.
  function parseISO(s){ const p=String(s).split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1,p[2])); }
  function toISO(d){ return d.toISOString().slice(0,10); }
  function addDays(s,n){ const d=parseISO(s); d.setUTCDate(d.getUTCDate()+n); return toISO(d); }
  // isValidIso : vrai si la chaîne a le bon format ET désigne un jour réel (refuse 2027-02-30).
  // Sert de garde à chaque lecture de date venant du fichier ou d'un champ de saisie.
  function isValidIso(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && !isNaN(parseISO(s)) && toISO(parseISO(s))===s; }
  // clone : copie profonde par JSON. Suffisant ici : les données ne contiennent que des objets simples.
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  // Mise en forme en français (dayNum à monthLabel). Fonctions d'affichage, sans effet sur les données.
  function dayNum(d){ return d===1 ? '1er' : String(d); }
  function longDate(s){ const d=parseISO(s); return dayNum(d.getUTCDate())+' '+MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear(); }
  function frDate(s){ const p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  function shortDay(s){ const d=parseISO(s); return SHORT_DAYS[d.getUTCDay()]+' '+dayNum(d.getUTCDate()); }
  function weekendLabel(saturday){
    const sunday=addDays(saturday,1), a=parseISO(saturday), b=parseISO(sunday);
    if(a.getUTCMonth()===b.getUTCMonth()) return 'sam. '+dayNum(a.getUTCDate())+' – dim. '+dayNum(b.getUTCDate())+' '+SHORT_MONTHS[b.getUTCMonth()];
    return 'sam. '+dayNum(a.getUTCDate())+' '+SHORT_MONTHS[a.getUTCMonth()]+' – dim. '+dayNum(b.getUTCDate())+' '+SHORT_MONTHS[b.getUTCMonth()];
  }
  function monthLabel(key){ const p=key.split('-'); return MONTHS[Number(p[1])-1]+' '+p[0]; }
  // today : date du jour selon l'horloge LOCALE du poste. C'est elle qui sépare les week-ends
  // « passés » (samedi <= aujourd'hui, jamais modifiés par un calcul) des week-ends à venir.
  // Un poste dont l'horloge est fausse classe donc mal les week-ends.
  function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  // frNumber : arrondi à 2 décimales et virgule décimale (1.5 devient « 1,5 »).
  function frNumber(n){ return (Math.round(n*100)/100).toString().replace('.',','); }

  /* Dimanche de Pâques (algorithme de Meeus / Jones / Butcher, calendrier grégorien) */
  // ----- Jours fériés -----
  // easter : date du dimanche de Pâques de l'année y. Calcul purement arithmétique, sans table ni réseau.
  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
    return toISO(new Date(Date.UTC(y,month-1,day)));
  }
  // holidays(y) : les 11 jours fériés nationaux de l'année y, sous la forme { 'AAAA-MM-JJ': libellé }.
  //   8 dates fixes, 3 dates mobiles déduites de Pâques : lundi de Pâques (+1 j), Ascension (+39 j),
  //   lundi de Pentecôte (+50 j). Les jours fériés propres à l'Alsace-Moselle ne sont pas gérés.
  //   Le résultat est mémorisé par année (holidayCache) pour ne pas refaire le calcul.
  const holidayCache={};
  function holidays(y){
    if(holidayCache[y]) return holidayCache[y];
    const p=easter(y), f={};
    f[y+'-01-01']="Jour de l'an";
    f[addDays(p,1)]='Lundi de Pâques';
    f[y+'-05-01']='Fête du Travail';
    f[y+'-05-08']='Victoire 1945';
    f[addDays(p,39)]='Ascension';
    f[addDays(p,50)]='Lundi de Pentecôte';
    f[y+'-07-14']='Fête nationale';
    f[y+'-08-15']='Assomption';
    f[y+'-11-01']='Toussaint';
    f[y+'-11-11']='Armistice 1918';
    f[y+'-12-25']='Noël';
    return (holidayCache[y]=f);
  }
  // holidayName : libellé du jour férié à cette date, ou null.
  function holidayName(iso){ return holidays(Number(iso.slice(0,4)))[iso] || null; }

  /* Week-ends dont le samedi et le dimanche sont dans la période. Clé = date du samedi.
     L'année d'un week-end est celle de son samedi. */
  // ----- Week-ends de la période et poids -----
  // MAX_WEEKENDS : garde-fou contre une période démesurée (borne le temps de calcul et la taille des écrans).
  const MAX_WEEKENDS=1100; // environ 21 ans
  // periodWeekends(reglages) : liste ordonnée des week-ends ENTIÈREMENT compris dans la période
  // (samedi >= début et dimanche <= fin). Liste vide si les dates sont invalides ou inversées.
  // Chaque élément :
  //   key ............. date du samedi ; identifiant du week-end dans toutes les données
  //   sunday .......... date du dimanche
  //   month, year ..... ceux du samedi
  //   holidays ........ jours fériés du vendredi au lundi : [{date, name, extended}]
  //   days ............ jours de permanence de ce week-end : 2, ou 3 s'il est prolongé
  //   extended ........ vrai si un férié tombe le vendredi ou le lundi
  //   label ........... texte affiché
  //   continuesPrev ... vrai si le week-end précédent de la liste est celui de la semaine d'avant
  //                     (sert à détecter deux week-ends d'affilée)
  // RÈGLE DE COMPTAGE (fixe, sans réglage)
  //   Un week-end compte 2 jours de permanence : le samedi et le dimanche.
  //   Chaque jour férié tombant le vendredi ou le lundi ajoute 1 jour : le week-end compte 3 jours.
  //   Un jour férié tombant le samedi ou le dimanche n'ajoute rien.
  //   La charge d'un agent est le total des jours de ses week-ends de permanence.
  function periodWeekends(settings){
    const start=settings.debut, endDate=settings.fin, res=[];
    if(!isValidIso(start)||!isValidIso(endDate)||start>endDate) return res;
    let saturday=start; while(parseISO(saturday).getUTCDay()!==6) saturday=addDays(saturday,1);
    while(addDays(saturday,1)<=endDate && res.length<MAX_WEEKENDS){
      let hols=[], extraDays=0;
      // offset = décalage en jours par rapport au samedi : -1 vendredi, 0 samedi, 1 dimanche, 2 lundi.
      [-1,0,1,2].forEach(function(offset){
        const date=addDays(saturday,offset), n=holidayName(date); if(!n) return;
        const extended=offset===-1||offset===2; if(extended) extraDays++;
        hols.push({date:date,name:n,extended:extended});
      });
      const prev=res.length?res[res.length-1]:null;
      res.push({key:saturday, sunday:addDays(saturday,1), month:saturday.slice(0,7), year:saturday.slice(0,4), holidays:hols, days:2+extraDays, extended:extraDays>0,
                label:weekendLabel(saturday), continuesPrev:!!(prev && prev.key===addDays(saturday,-7))});
      saturday=addDays(saturday,7);
    }
    return res;
  }

  /* ---------- Données ---------- */
  // ----- Données -----
  // defaultSettings : valeurs d'un fichier neuf, et valeurs de repli quand un réglage lu est invalide.
  function defaultSettings(){
    return {titre:'Permanences du week-end', debut:'2027-01-01', fin:'2027-06-30', parWeekend:1, eviterConsecutifs:true};
  }
  // newData : structure vide du fichier permanences-donnees.json.
  //   salaries ..... agents [{id, nom, depuis}] (nom de clé historique ; l'interface dit « agent »)
  //                  depuis : date d'arrivée 'AAAA-MM-JJ', ou '' si l'agent est là depuis le début
  //   retires ...... identifiants des agents supprimés : empêche une opération en retard de les recréer
  //   indispos ..... { id agent : [dates de samedi] }
  //   planning ..... affectations { samedi : [id agent, ...] }, verrous [samedis], savedAt
  //   journal ...... toujours vide dans le fichier ; sert de tampon en mémoire avant écriture du .log
  //   updatedAt ........ horodatage de la dernière écriture
  function newData(){
    return {format:FORMAT, version:1, reglages:defaultSettings(), salaries:[], retires:[], indispos:{},
            planning:{affectations:{}, verrous:[], enregistreLe:null}, journal:[], majLe:null};
  }
  // normalize(d) : POINT D'ENTRÉE DE TOUTE DONNÉE LUE DANS LE FICHIER. Contrôle de sécurité principal.
  //   - Lève une erreur si le contenu n'est pas un objet ou porte un autre format : la page refuse alors
  //     d'ouvrir le fichier et n'écrit rien.
  //   - Reconstruit un objet neuf à partir des seuls champs connus : tout champ inattendu est ignoré.
  //   - Chaque réglage est typé et borné ; une valeur invalide est remplacée par la valeur par défaut.
  //   - Les dates sont filtrées par isValidIso ; les identifiants et les noms sont convertis en chaînes.
  // Points d'attention :
  //   - Les anciens réglages de poids (poidsFerie, poidsFerieWe) ne sont plus lus : s'ils figurent dans
  //     un fichier ancien, ils sont ignorés puis disparaissent à la première écriture.
  //   - Une date d'arrivée invalide est ignorée ; une ancienne quotité éventuelle n'est plus lue.
  //   - La longueur des noms et le nombre d'agents ne sont pas bornés.
  //   - Les clés de « affectations » ne sont pas contrôlées ici : une clé qui n'est pas un samedi de la
  //     période est simplement ignorée par l'affichage et par le calcul.
  //   - Un identifiant d'agent inconnu dans une affectation est ignoré par analyze() et par propose().
  function normalize(d){
    if(!d || typeof d!=='object' || Array.isArray(d)) throw new Error("ce fichier ne contient pas de données de permanences");
    if(d.format && d.format!==FORMAT) throw new Error("ce fichier n'est pas un fichier de permanences");
    const n=newData(), r=d.reglages||{}, defaults=n.reglages;
    n.reglages={
      titre: typeof r.titre==='string' && r.titre.trim() ? r.titre : defaults.titre,
      debut: isValidIso(r.debut)?r.debut:defaults.debut,
      fin: isValidIso(r.fin)?r.fin:defaults.fin,
      parWeekend: Math.min(10,Math.max(1,parseInt(r.parWeekend,10)||defaults.parWeekend)),
      eviterConsecutifs: r.eviterConsecutifs===undefined ? defaults.eviterConsecutifs : !!r.eviterConsecutifs
    };
    n.salaries=(Array.isArray(d.salaries)?d.salaries:[]).filter(function(s){return s&&s.id&&s.nom;}).map(function(s){return {id:String(s.id),nom:String(s.nom),depuis:isValidIso(s.depuis)?s.depuis:''};});
    n.retires=(Array.isArray(d.retires)?d.retires:[]).map(String);
    const unav=d.indispos&&typeof d.indispos==='object'?d.indispos:{};
    Object.keys(unav).forEach(function(k){ if(Array.isArray(unav[k])&&unav[k].length) n.indispos[k]=unav[k].filter(isValidIso).sort(); });
    const p=d.planning||{};
    const asg=p.affectations&&typeof p.affectations==='object'?p.affectations:{};
    Object.keys(asg).forEach(function(k){ if(Array.isArray(asg[k])) n.planning.affectations[k]=asg[k].map(function(x){return x?String(x):'';}); });
    n.planning.verrous=Array.isArray(p.verrous)?p.verrous.filter(isValidIso):[];
    n.planning.enregistreLe=p.enregistreLe||null;
    n.journal=[]; // le journal est dans le fichier permanences.log
    n.majLe=d.majLe||null;
    return n;
  }
  // serialize : texte écrit dans le fichier. Indenté pour rester lisible et comparable ligne à ligne.
  function serialize(d){ return JSON.stringify(d,null,1); }
  // isPresent : l'agent est-il arrivé à la date de ce week-end (samedi >= date d'arrivée) ?
  // Avant son arrivée, un agent n'est jamais affecté et ce week-end n'entre pas dans sa charge attendue.
  function isPresent(s,key){ return !s.depuis || key>=s.depuis; }

  /* ---------- Fichier log (permanences.log, dans le même dossier) ----------
     Une ligne par modification : date | rôle | action [#identifiant]. L'identifiant évite les doublons.
     Aucune information sur le poste ni sur la personne n'est enregistrée. */
  // ----- Journal (permanences.log) -----
  const LOG_FILE='permanences.log';
  function twoDigits(n){ return (n<10?'0':'')+n; }
  // logLine(e) : une entrée de journal vers une ligne « date heure | rôle | détail [#identifiant] ».
  //   L'heure est celle du poste. Le rôle vaut « Administration » ou « Agent ».
  //   clean() retire les retours à la ligne, tabulations, barres verticales et crochets de chaque champ :
  //   un nom d'agent ne peut donc ni créer une fausse ligne, ni imiter un identifiant (injection de journal).
  function logLine(e){
    let d=new Date(e.at); if(isNaN(d)) d=new Date();
    const q=d.getFullYear()+'-'+twoDigits(d.getMonth()+1)+'-'+twoDigits(d.getDate())+' '+twoDigits(d.getHours())+':'+twoDigits(d.getMinutes())+':'+twoDigits(d.getSeconds());
    function clean(x){ return String(x||'').replace(/[\r\n\t|\[\]]+/g,' ').replace(/\s+/g,' ').trim(); }
    return q+' | '+(clean(e.author)||'-')+' | '+clean(e.detail)+' [#'+clean(e.id)+']';
  }
  // lineId : identifiant placé en fin de ligne, ou null. Sert à ne jamais écrire deux fois la même ligne.
  function lineId(l){ const m=/\[#([^\]]*)\]\s*$/.exec(l); return m?m[1]:null; }
  // LOG_MODEL : décrit à Store comment lire, modifier et écrire le journal.
  // Un « modèle » fournit : empty() contenu d'un fichier absent . fromText(texte) . toText(donnees) .
  // normalize(donnees) . applyOp(donnees, operation) . opKey(operation).
  // Ici une opération ajoute des lignes ; une ligne dont l'identifiant existe déjà est ignorée.
  // Le fichier est relu et réécrit en entier à chaque ajout (fins de ligne Windows).
  const LOG_MODEL={
    empty:function(){ return {lines:[]}; },
    fromText:function(txt){ return {lines:String(txt).replace(/^﻿/,'').split(/\r?\n/).filter(function(l){return l.trim();})}; },
    toText:function(d){ return d.lines.join('\r\n')+'\r\n'; },
    normalize:function(d){ return {lines:(d&&Array.isArray(d.lines)?d.lines:[]).map(String)}; },
    applyOp:function(d,op){
      const ids={}; d.lines.forEach(function(l){ const i=lineId(l); if(i) ids[i]=1; });
      (op.lines||[]).forEach(function(l){ const i=lineId(l); if(!i||!ids[i]){ d.lines.push(l); if(i) ids[i]=1; } });
      return d;
    },
    opKey:function(op){ return 'l|'+op.id; }
  };
  // findEmployee : agent portant cet identifiant, ou null.
  // nameKey : forme de comparaison d'un nom (espaces réduits, minuscules) pour détecter les doublons.
  // splitNames : texte libre vers liste de noms (séparateurs : ligne, virgule, point-virgule), sans doublon.
  function findEmployee(d,id){ for(let i=0;i<d.salaries.length;i++) if(d.salaries[i].id===id) return d.salaries[i]; return null; }
  function nameKey(s){ return String(s).trim().replace(/\s+/g,' ').toLocaleLowerCase('fr'); }
  function splitNames(txt){
    const seen={}, res=[];
    String(txt).split(/[\n\r,;]+/).forEach(function(n){ n=n.trim().replace(/\s+/g,' '); const k=nameKey(n); if(n&&!seen[k]){seen[k]=1;res.push(n);} });
    return res;
  }

  /* Chaque opération est idempotente : l'appliquer deux fois donne le même résultat.
     C'est ce qui permet de la rejouer sur la dernière version du fichier sans rien écraser. */
  // ----- Opérations -----
  // LOG_MAX borne le tampon de journal en mémoire.
  const LOG_MAX=5000;
  const SETTING_NAMES={titre:'titre',debut:'début',fin:'fin',parWeekend:'agents par week-end',eviterConsecutifs:'éviter les week-ends consécutifs'};
  function settingText(k,v){ return typeof v==='boolean'?(v?'oui':'non'):(k==='debut'||k==='fin')&&isValidIso(v)?frDate(v):String(v); }
  function weekendText(key){ return isValidIso(key)?weekendLabel(key)+' '+key.slice(0,4):String(key); }
  /* Journal : une entrée par modification réellement effectuée. */
  function dayMonth(c){ return isValidIso(c)?frDate(c).slice(0,5):String(c); }
  function summarizeSchedule(d,asg){
    const names={}; d.salaries.forEach(function(x){names[x.id]=x.nom;});
    return Object.keys(asg||{}).sort().filter(function(c){return (asg[c]||[]).some(Boolean);}).map(function(c){ return dayMonth(c)+' '+asg[c].filter(Boolean).map(function(id){return names[id]||'?';}).join('+'); }).join(', ');
  }
  // record : ajoute au tampon d.journal l'entrée correspondant à une opération RÉELLEMENT effectuée.
  // Une opération sans effet (déjà appliquée) n'appelle pas record : elle ne laisse donc aucune trace.
  // Store._write vide ce tampon et transmet les entrées à l'interface, qui les écrit dans le .log.
  function record(d,op,detail){
    if(op.id && d.journal.some(function(e){return e.id===op.id;})) return;
    const e={id:op.id||'',at:op.at||new Date().toISOString(),author:op.author||'',type:op.type,detail:detail};
    d.journal.push(e);
    if(d.journal.length>LOG_MAX) d.journal.splice(0,d.journal.length-LOG_MAX);
  }

  /* Chaque opération est idempotente : l'appliquer deux fois donne le même résultat.
     C'est ce qui permet de la rejouer sur la dernière version du fichier sans rien écraser. */
  // applyOp(d, op) : SEUL point de modification des données. Modifie d en place et le retourne.
  //   op = { type, id, at, author, ... } ; « author » est un rôle, jamais un nom de personne.
  //   Propriété essentielle : chaque opération est IDEMPOTENTE et décrit un ÉTAT VOULU, pas un geste.
  //   Exemple : « unavailable » dit « cet agent est indisponible ce week-end », et non « inverser la case ».
  //   On peut donc la rejouer sur une version plus récente du fichier sans rien casser.
  //   Un type inconnu lève une erreur.
  function applyOp(d,op){
    let s,i,arr,before,asg,txt;
    switch(op.type){
      // creation : aucune modification ; écrit seulement la ligne de journal de création du fichier.
      case 'creation':
        record(d,op,'Création du fichier de données');
        break;
      // unavailable {employee, we, val} : pose (val vrai) ou retire (val faux) une indisponibilité.
      // Ignorée si l'agent n'existe plus. Aucun contrôle d'identité : voir l'action « toggle » de l'interface.
      case 'unavailable':
        s=findEmployee(d,op.employee); if(!s) break;
        arr=d.indispos[op.employee]||[];
        i=arr.indexOf(op.we);
        if(op.val && i<0){
          arr.push(op.we); arr.sort(); d.indispos[op.employee]=arr;
          record(d,op,s.nom+' : indisponible le '+weekendText(op.we));
        }else if(!op.val && i>=0){
          arr.splice(i,1); if(arr.length) d.indispos[op.employee]=arr; else delete d.indispos[op.employee];
          record(d,op,s.nom+' : de nouveau disponible le '+weekendText(op.we));
        }
        break;
      // addEmployees {employees:[{id, name}]} : ajoute les agents absents. Sont ignorés : un identifiant déjà
      // présent, un identifiant d'agent supprimé (liste retires), un nom déjà porté (comparaison par nameKey).
      case 'addEmployees':
        txt=[];
        (op.employees||[]).forEach(function(n){
          if(findEmployee(d,n.id) || d.retires.indexOf(n.id)>=0) return;
          if(d.salaries.some(function(x){return nameKey(x.nom)===nameKey(n.name);})) return;
          d.salaries.push({id:n.id,nom:n.name,depuis:''}); txt.push(n.name);
        });
        if(txt.length) record(d,op,(txt.length>1?'Ajout d’agents : ':'Ajout de l’agent ')+txt.join(', '));
        break;
      // rename {employee, name} : change le nom affiché. L'identifiant, lui, ne change jamais.
      case 'rename':
        s=findEmployee(d,op.employee);
        if(s && s.nom!==op.name){ before=s.nom; s.nom=op.name; record(d,op,'Renommage : '+before+' → '+op.name); }
        break;
      // profile {employee, since} : fixe la date d'arrivée d'un agent (revalidée ici).
      case 'profile':
        s=findEmployee(d,op.employee); if(!s) break;
        const since=isValidIso(op.since)?op.since:'';
        if((s.depuis||'')!==since){ record(d,op,s.nom+' : arrivée '+(s.depuis?frDate(s.depuis):'début de période')+' → '+(since?frDate(since):'début de période')); s.depuis=since; }
        break;
      // remove {employee} : supprime l'agent et ses indisponibilités, vide ses postes dans le planning
      // (la case est conservée, vide, pour ne pas décaler les autres agents du même week-end).
      // L'identifiant rejoint la liste retires. Le détail supprimé part dans le journal.
      case 'remove':
        s=findEmployee(d,op.employee);
        if(d.retires.indexOf(op.employee)<0) d.retires.push(op.employee);
        if(!s) break;
        const unav=(d.indispos[op.employee]||[]).slice(), slots=[];
        d.salaries=d.salaries.filter(function(x){return x.id!==op.employee;});
        delete d.indispos[op.employee];
        Object.keys(d.planning.affectations).forEach(function(k){
          const a=d.planning.affectations[k];
          for(let j=0;j<a.length;j++) if(a[j]===op.employee){ a[j]=''; slots.push({we:k,slot:j}); }
        });
        record(d,op,'Suppression de '+s.nom+' ('+unav.length+' indisponibilité'+(unav.length>1?'s':'')+', '+slots.length+' permanence'+(slots.length>1?'s':'')+' libérée'+(slots.length>1?'s':'')+')'+
          (unav.length?' — indisponibilités : '+unav.map(dayMonth).join(', '):'')+(slots.length?' — permanences libérées : '+slots.map(function(x){return dayMonth(x.we);}).join(', '):''));
        break;
      // settings {values} : ne modifie que les réglages connus (clés de SETTING_NAMES) dont la valeur change.
      // Les valeurs sont contrôlées avant envoi par l'action « save-settings », puis à chaque relecture
      // par normalize().
      case 'settings':
        txt=[];
        Object.keys(op.values||{}).forEach(function(k){
          if(!(k in SETTING_NAMES)) return;
          if(JSON.stringify(d.reglages[k])!==JSON.stringify(op.values[k])){
            txt.push(SETTING_NAMES[k]+' : '+settingText(k,d.reglages[k])+' → '+settingText(k,op.values[k]));
            d.reglages[k]=op.values[k];
          }
        });
        if(txt.length) record(d,op,'Réglages modifiés – '+txt.join(' ; '));
        break;
      // schedule {assignments, locks} : REMPLACE tout le planning enregistré. Le journal reçoit le résumé
      // complet du nouveau planning. Si deux administrateurs enregistrent en même temps, le dernier l'emporte.
      case 'schedule':
        before=d.planning;
        const newPlan={affectations:clone(op.assignments||{}), verrous:(op.locks||[]).slice().sort(), enregistreLe:op.at||null};
        if(JSON.stringify(before)===JSON.stringify(newPlan)) break;
        d.planning=newPlan;
        asg=newPlan.affectations; const filled=Object.keys(asg).filter(function(k){return asg[k].some(Boolean);}).length;
        record(d,op,'Planning enregistré ('+filled+' week-end'+(filled>1?'s':'')+' avec permanence) : '+summarizeSchedule(d,asg));
        break;
      // clearSchedule : vide le planning. Le contenu effacé est recopié dans le journal.
      case 'clearSchedule':
        before=d.planning;
        if(!Object.keys(before.affectations).length && !before.verrous.length) break;
        d.planning={affectations:{}, verrous:[], enregistreLe:null};
        record(d,op,'Planning effacé (contenu précédent : '+(summarizeSchedule(d,before.affectations)||'vide')+')');
        break;
      default: throw new Error('Opération inconnue : '+op.type);
    }
    return d;
  }
  // opKey : désigne la CIBLE d'une opération (telle case d'indisponibilité, tel agent, les réglages,
  // le planning). Store s'en sert pour ne revérifier que la dernière opération émise sur une même cible :
  // une saisie plus ancienne ne doit pas être rétablie par-dessus une saisie plus récente.
  function opKey(op){
    switch(op.type){
      case 'unavailable': return 'i|'+op.employee+'|'+op.we;
      case 'rename': case 'remove': return 's|'+op.employee;
      case 'profile': return 'q|'+op.employee;
      case 'addEmployees': return 'a|'+(op.id||'');
      case 'settings': return 'r|'+Object.keys(op.values||{}).sort().join(',');
      default: return 'p';
    }
  }
  // isApplied : une opération est « déjà appliquée » si l'appliquer ne change rien aux données
  // (comparaison des textes JSON, horodatage updatedAt exclu). C'est le test d'idempotence utilisé par Store.
  function withoutStamp(d){ const c=clone(d); delete c.majLe; return JSON.stringify(c); }
  const DATA_MODEL={normalize:normalize,applyOp:applyOp,opKey:opKey,empty:null};
  function isApplied(m,d,op){ return withoutStamp(d)===withoutStamp(m.applyOp(clone(d),op)); }

  /* ---------- Synchronisation avec le fichier partagé ----------
     io = { read(): Promise<string>, write(texte): Promise<void> }
     Chaque modification : relecture du fichier -> application de la seule opération -> contrôle que
     le fichier n'a pas bougé entre-temps -> écriture. Puis vérifications différées : si l'écriture d'un
     collègue partie d'une version antérieure a effacé notre changement, on le réapplique. */
  // ----- Synchronisation avec un fichier partagé : Store -----
  // PROBLÈME : plusieurs postes écrivent le même fichier d'un partage réseau, sans serveur ni verrou.
  // PRINCIPE : contrôle de concurrence optimiste.
  //   1. relire le fichier ;
  //   2. appliquer la seule opération demandée à cette version fraîche ;
  //   3. relire juste avant d'écrire : si le texte a changé, un collègue a écrit, on recommence ;
  //   4. écrire le fichier entier ;
  //   5. revérifier plus tard (0,8 s, 2,5 s, 6 s) que l'opération est toujours présente, sinon la refaire.
  // GARANTIE ET LIMITE : il reste un court intervalle entre la relecture (3) et l'écriture (4) où deux
  // postes peuvent s'écraser. Les revérifications (5) et l'idempotence des opérations réparent ce cas.
  // La garantie est donc pratique, non transactionnelle : elle suppose que le poste reste ouvert
  // quelques secondes après la saisie. Fermer la page aussitôt après un clic annule ces revérifications.
  // C'est pourquoi busy() dit si une écriture ou une revérification est en attente (l'interface
  // avertit alors avant la fermeture), et onIdle signale le moment où tout est vérifié.
  //
  // Paramètres : io = { read(): Promise<texte>, write(texte): Promise }, fourni par l'interface.
  // Options : checkDelays . wait (injectable pour les tests) . onRepair . model . onLog
  //           . onIdle(tally) : appelée quand plus rien n'est en attente ; tally = {merges, abandons}
  //             compte, depuis le précédent appel, les opérations rétablies et celles abandonnées.
  // État interne :
  //   chain ............ file d'attente : une seule lecture ou écriture à la fois pour ce Store
  //   pending .......... opérations émises mais pas encore écrites
  //   latest ........... dernière version lue du fichier
  //   lastSeqByKey ..... numéro de la dernière opération émise pour chaque cible (voir opKey)
  //   repairs .......... nombre d'opérations rétablies après écrasement
  //   tally ............ rétablissements et abandons depuis le dernier onIdle
  function Store(io,o){
    o=o||{};
    this.io=io;
    this.checkDelays=o.checkDelays||[800,2500,6000];
    this.wait=o.wait||function(ms){return new Promise(function(r){setTimeout(r,ms);});};
    this.onRepair=o.onRepair||null;
    this.m=o.model||DATA_MODEL;
    this.onLog=o.onLog||null; // reçoit les entrées de journal produites par chaque écriture
    this.chain=Promise.resolve();
    this.pending=[];
    this.latest=null;
    this.lastSeqByKey={};
    this.seq=0;
    this.repairs=0;
    this.pendingChecks=0;
    this.onIdle=o.onIdle||null;
    this.tally={merges:0,abandons:0};
  }
  // busy : vrai tant qu'une opération n'est pas écrite ou qu'une revérification est programmée.
  // Fermer la page dans cet état peut faire perdre la saisie (voir GARANTIE ET LIMITE).
  Store.prototype.busy=function(){ return this.pending.length>0||this.pendingChecks>0; };
  // _abandon : compte une seule fois une opération qui a dépassé la limite de réparations.
  Store.prototype._abandon=function(op){ if(!op.abandoned){ op.abandoned=true; this.tally.abandons++; } };
  // _checkDone : une revérification est terminée ; si plus rien n'est en attente, appelle onIdle.
  Store.prototype._checkDone=function(){
    this.pendingChecks--;
    if(this.busy()) return;
    const b=this.tally; this.tally={merges:0,abandons:0};
    if(this.onIdle){ try{ this.onIdle(b); }catch(e){} }
  };
  // enqueue : met fn dans la file. Une erreur n'interrompt pas la file ; elle est rendue à l'appelant.
  Store.prototype.enqueue=function(fn){ const p=this.chain.then(fn); this.chain=p.catch(function(){}); return p; };
  // readRobust : lit et valide le fichier, jusqu'à 6 essais espacés de 150 à 900 ms (un partage réseau
  // peut répondre par un fichier momentanément vide ou tronqué pendant l'écriture d'un collègue).
  // Une perte d'autorisation (NotAllowedError) est remontée aussitôt, sans nouvel essai.
  // Un fichier vide est une erreur pour les données, et un journal neuf pour le .log (model.empty).
  Store.prototype.readRobust=async function(){
    let err;
    for(let i=0;i<6;i++){
      try{
        const txt=await this.io.read();
        if(!txt||!txt.trim()){ if(this.m.empty) return {txt:txt||'', data:this.m.empty()}; throw new Error('fichier vide'); }
        return {txt:txt, data:this.m.normalize(this.m.fromText?this.m.fromText(txt):JSON.parse(txt))};
      }catch(e){ err=e; if(e&&e.name==='NotAllowedError') throw e; await this.wait(150*(i+1)); }
    }
    throw new Error('lecture du fichier impossible ('+(err&&err.message)+')');
  };
  // view : ce que l'écran doit montrer = dernière version lue + opérations pas encore écrites.
  Store.prototype.view=function(){
    const d=clone(this.latest), m=this.m;
    this.pending.forEach(function(op){ m.applyOp(d,op); });
    return d;
  };
  // loadData : relit le fichier (dans la file) et retourne la vue.
  Store.prototype.loadData=function(){
    const self=this;
    return this.enqueue(async function(){ const r=await self.readRobust(); self.latest=r.data; return self.view(); });
  };
  // execute(op) : numérote l'opération, l'écrit (dans la file), puis programme les revérifications.
  // En cas d'échec, l'erreur est rendue à l'appelant mais une revérification reste programmée :
  // c'est elle qui retentera l'écriture.
  Store.prototype.execute=function(op){
    const self=this;
    op.seq=++this.seq;
    this.lastSeqByKey[this.m.opKey(op)]=op.seq;
    this.pending.push(op);
    return this.enqueue(async function(){
      try{ await self._write(op); }
      catch(e){ op.repairs=(op.repairs||0)+1; self._scheduleChecks(op); throw e; } // nouvel essai automatique
      finally{ self.pending=self.pending.filter(function(x){return x!==op;}); }
      self._scheduleChecks(op);
      return self.view();
    });
  };
  // _write(op) : étapes 1 à 4 du principe, 25 tentatives au plus. Retourne faux si rien n'était à écrire.
  // L'attente entre deux tentatives est aléatoire et croissante, pour que deux postes en conflit
  // ne recommencent pas au même instant.
  Store.prototype._write=async function(op){
    for(let attempt=0;attempt<25;attempt++){
      const r=await this.readRobust();
      if(isApplied(this.m,r.data,op)){ this.latest=r.data; return false; }
      const logCount=r.data.journal?r.data.journal.length:0;
      this.m.applyOp(r.data,op);
      const newEntries=r.data.journal?r.data.journal.slice(logCount):[];
      if(r.data.journal) r.data.journal=[]; // le journal part dans son propre fichier
      r.data.majLe=new Date().toISOString();
      const output=this.m.toText?this.m.toText(r.data):serialize(r.data);
      const before=await this.io.read();
      // Un collègue vient d'écrire : on recommence, en attendant un peu plus à chaque fois.
      if((before||'')!==(r.txt||'')){ await this.wait((40+Math.random()*250)*Math.min(1+attempt/3,4)); continue; }
      await this.io.write(output);
      this.latest=r.data;
      if(newEntries.length&&this.onLog){ try{ this.onLog(newEntries); }catch(e){} }
      return true;
    }
    throw new Error("le fichier est modifié en continu par d'autres personnes, réessayez dans un instant");
  };
  // _scheduleChecks : programme les revérifications différées de cette opération.
  Store.prototype._scheduleChecks=function(op){
    const self=this;
    this.checkDelays.forEach(function(ms){
      self.pendingChecks++;
      setTimeout(function(){
        self.enqueue(function(){ return self._check(op); }).catch(function(){}).then(function(){ self._checkDone(); });
      }, ms);
    });
  };
  // _check(op) : sans objet si une opération plus récente vise la même cible. Sinon relit le fichier
  // et, si l'opération en a disparu, la réécrit. Borné à 20 réparations par opération : au-delà,
  // l'opération est abandonnée et comptée dans tally.abandons.
  Store.prototype._check=async function(op){
    if(this.lastSeqByKey[this.m.opKey(op)]!==op.seq) return;
    let r;
    try{ r=await this.readRobust(); }
    catch(e){ op.repairs=(op.repairs||0)+1; if(op.repairs<=20) this._scheduleChecks(op); else this._abandon(op); throw e; }
    this.latest=r.data;
    if(isApplied(this.m,r.data,op)) return;
    op.repairs=(op.repairs||0)+1;
    try{ await this._write(op); }
    catch(e){ if(op.repairs<=20) this._scheduleChecks(op); else this._abandon(op); throw e; } // fichier très sollicité : on réessaiera plus tard
    this.repairs++; this.tally.merges++;
    // La réécriture peut à son tour être écrasée : on la revérifie (avec une limite de sécurité).
    if(op.repairs<=20) this._scheduleChecks(op);
    if(this.onRepair) this.onRepair(this.view());
  };

  /* ---------- Répartition ---------- */
  // ----- Répartition automatique : propose -----
  // propose(data, o) : calcule un planning. NE MODIFIE PAS data et n'écrit rien : le résultat est un
  // aperçu que l'administration enregistre ou abandonne.
  // Options o :
  //   base .......... planning d'où sont repris les week-ends figés
  //   locks ......... week-ends à ne pas modifier
  //   today ......... les week-ends dont le samedi est <= à cette date sont figés
  //   reference ..... planning de départ du mode « adjust » ; absent en proposition complète
  //   durationMs, minAttempts, maxAttempts, rng ... réglages de la recherche (injectables pour les tests)
  // Résultat : { assignments {samedi:[id agent]}, attempts, cost, changes }.
  //
  // MÉTHODE : heuristique. Plusieurs constructions gloutonnes, chacune améliorée par recherche locale ;
  // on garde la meilleure. Le résultat n'est pas garanti optimal et dépend du hasard (Math.random,
  // qui n'a ici aucun rôle de sécurité).
  //
  // NOTATIONS
  //   W = nombre de week-ends . E = nombre d'agents . k = agents par week-end . Y = nombre d'années
  //   Un planning A est un tableau de W listes d'indices d'agents.
  //   weights[i] . yearIdx[i] indice de l'année . consec[i] vrai si le week-end i suit le week-end i-1
  //   avail[i][e] vrai si l'agent e est disponible le week-end i . freeCount[i] nombre de disponibles
  //   locked[i] vrai si le week-end i est figé . fixed[i] son contenu . ref[i] son contenu de référence
  function propose(data,o){
    o=o||{};
    const R=data.reglages, wes=periodWeekends(R), ids=data.salaries.map(function(s){return s.id;});
    const W=wes.length, E=ids.length, k=Math.max(1,R.parWeekend|0), avoid=!!R.eviterConsecutifs;
    const rng=o.rng||Math.random, budget=o.durationMs==null?1500:o.durationMs, maxAttempts=o.maxAttempts||80, minAttempts=o.minAttempts||6;
    const idx={}; ids.forEach(function(id,i){idx[id]=i;});
    // La note est calculée en « week-ends » : 2 jours = 1, 3 jours = 1,5. Seule l'unité diffère de
    // l'affichage (en jours) ; les coefficients de la note sont réglés pour cette unité.
    const weights=wes.map(function(w){return w.days/2;});
    // Index de l'année de chaque week-end : sur une période de plusieurs années, on équilibre aussi chaque année.
    const years=[], yearIdx=wes.map(function(w){ let y=years.indexOf(w.year); if(y<0){ years.push(w.year); y=years.length-1; } return y; }), Y=years.length;
    const consec=wes.map(function(w){return w.continuesPrev;});
    // Disponible = arrivé à cette date ET non déclaré indisponible.
    const avail=wes.map(function(w){ return data.salaries.map(function(s){ return isPresent(s,w.key) && (data.indispos[s.id]||[]).indexOf(w.key)<0; }); });
    const freeCount=avail.map(function(a){ return a.filter(Boolean).length; });
    // CHARGE ATTENDUE (prorata de présence). share[e] = total des week-ends où l'agent est présent.
    // La charge visée pour un agent est : charge totale x share[e] / somme des share.
    // Si tous les agents sont présents depuis le début, toutes les parts sont égales :
    // la charge visée est alors la moyenne.
    // shareY, shareSumY : mêmes grandeurs, année par année. rel[e] : part de l'agent rapportée à la part moyenne.
    let share=new Array(E).fill(0), shareY=new Array(Y*E).fill(0), shareSum=0, shareSumY=new Array(Y).fill(0);
    data.salaries.forEach(function(s,e){
      wes.forEach(function(w,i){ if(!isPresent(s,w.key)) return; const p=weights[i]; share[e]+=p; shareY[yearIdx[i]*E+e]+=p; });
    });
    share.forEach(function(p,e){ shareSum+=p; for(let y=0;y<Y;y++) shareSumY[y]+=shareY[y*E+e]; });
    const rel=share.map(function(p){ return shareSum>0&&p>0 ? p*E/shareSum : 1e-9; });
    const locks={}; (o.locks||[]).forEach(function(c){locks[c]=1;});
    const base=o.base||{};
    // Un week-end passé (samedi <= aujourd'hui) n'est jamais modifié par une proposition.
    const todayIso=o.today||'';
    // Figé = verrouillé par l'administration, ou passé.
    const locked=wes.map(function(w){return !!locks[w.key] || (!!todayIso && w.key<=todayIso);});
    const res={assignments:{}, attempts:0, cost:0, changes:0};
    if(!W) return res;
    // Aucun agent : seuls les week-ends figés gardent leur contenu.
    if(!E){ wes.forEach(function(w,i){ res.assignments[w.key]=locked[i]?(base[w.key]||[]).slice():[]; }); return res; }
    // Mode « adjust » : chaque changement par rapport au planning de référence coûte un peu,
    // pour ne modifier que le nécessaire. La réduction de l'écart de charge reste prioritaire.
    const refAsg=o.reference||null, changeCost=refAsg?(o.changeWeight==null?2:o.changeWeight):0;
    const ref=wes.map(function(w){ return ((refAsg&&refAsg[w.key])||[]).filter(function(id){return id in idx;}).map(function(id){return idx[id];}); });
    const fixed=wes.map(function(w,i){
      if(!locked[i]) return null;
      return (base[w.key]||[]).filter(function(id){return id in idx;}).map(function(id){return idx[id];});
    });

    // Sur une période de plusieurs années, une amélioration peut être longue : on la borne dans le temps.
    const t0=Date.now();
    // Garde-fou de durée : au-delà de 3 fois le budget (3,6 s avec le réglage de l'interface),
    // l'amélioration en cours s'arrête et rend le meilleur planning atteint.
    function tooLong(){ return budget>0 && Date.now()-t0>budget*3; }
    // cost(A) : la NOTE d'un planning. Plus elle est basse, meilleur il est.
    //   unfilled ... postes non pourvus                                         x 1 000 000
    //   cons ....... fois où un agent enchaîne deux week-ends (si l'option)     x 1 000
    //   v .......... somme des carrés des écarts entre charge et charge attendue, période entière   x 10
    //   vy ......... même somme, calculée dans chaque année puis additionnée (si Y > 1)    x 3
    //   mx - mn .... écart entre l'agent le plus au-dessus et le plus en dessous de sa part   x 1
    //   changeCount  affectations absentes du planning de référence (mode « adjust »)      x 2
    // Les coefficients sont assez éloignés pour former une hiérarchie : pourvoir les postes, puis éviter
    // les enchaînements, puis équilibrer, puis limiter les changements.
    // Les week-ends figés entrent dans la charge mais pas dans le compte des changements.
    function cost(A){
      let load=new Array(E).fill(0), unfilled=0, cons=0, i, j, a;
      let changeCount=0, loadY=Y>1?new Array(Y*E).fill(0):null;
      for(i=0;i<W;i++){
        a=A[i]; if(a.length<k) unfilled+=k-a.length;
        for(j=0;j<a.length;j++){
          load[a[j]]+=weights[i];
          if(loadY) loadY[yearIdx[i]*E+a[j]]+=weights[i];
          if(consec[i]&&A[i-1].indexOf(a[j])>=0) cons++;
          if(changeCost&&!locked[i]&&ref[i].indexOf(a[j])<0) changeCount++;
        }
      }
      let tot=0,mx=-Infinity,mn=Infinity,v=0,vy=0,d;
      for(i=0;i<E;i++) tot+=load[i];
      // d = écart entre la charge de l'agent et sa charge attendue.
      for(i=0;i<E;i++){ d=load[i]-(shareSum>0?tot*share[i]/shareSum:0); v+=d*d; if(d>mx)mx=d; if(d<mn)mn=d; }
      if(loadY) for(let y=0;y<Y;y++){
        let ty=0; for(i=0;i<E;i++) ty+=loadY[y*E+i];
        for(i=0;i<E;i++){ d=loadY[y*E+i]-(shareSumY[y]>0?ty*shareY[y*E+i]/shareSumY[y]:0); vy+=d*d; }
      }
      // Formule de la note.
      return unfilled*1e6 + (avoid?cons*1000:0) + v*10 + vy*3 + (mx-mn) + changeCost*changeCount;
    }
    // adjacent : vrai si placer l'agent e au week-end i créerait deux week-ends d'affilée (avant ou après).
    function adjacent(A,i,e){
      return (consec[i]&&A[i-1].indexOf(e)>=0) || (i+1<W&&consec[i+1]&&A[i+1].indexOf(e)>=0);
    }
    // build(initial, dropRate) : fabrique un planning de départ.
    //   Les week-ends figés sont recopiés. Les autres partent de « initial » (en retirant les agents devenus
    //   indisponibles), ou vides ; dropRate = part des week-ends volontairement vidés pour varier les essais.
    //   Les postes vides sont ensuite pourvus en traitant d'abord les week-ends où le moins d'agents sont
    //   disponibles : ce sont eux qui laissent le moins de choix.
    function build(initial,dropRate){
      const A=wes.map(function(w,i){
        if(locked[i]) return fixed[i].slice();
        if(!initial||(dropRate&&rng()<dropRate)) return [];
        const a=[]; initial[i].forEach(function(e){ if(avail[i][e]&&a.indexOf(e)<0&&a.length<k) a.push(e); });
        return a;
      });
      const load=new Array(E).fill(0);
      A.forEach(function(a,i){a.forEach(function(e){load[e]+=weights[i];});});
      // Les week-ends les plus contraints (le moins de personnes disponibles) sont traités en premier.
      const order=[]; for(let i=0;i<W;i++) if(!locked[i]) order.push({i:i,r:rng()});
      order.sort(function(x,y){return (freeCount[x.i]-freeCount[y.i])||(x.r-y.r);});
      order.forEach(function(o){
        const i=o.i;
        while(A[i].length<k){
          let best=-1,bs=Infinity;
          for(let e=0;e<E;e++){
            if(!avail[i][e]||A[i].indexOf(e)>=0) continue;
            // Choix glouton : l'agent disponible dont la charge APRÈS affectation, rapportée à sa part, serait la plus basse.
            // Le terme aléatoire (moins de 0,9) départage les agents proches ; +1000 écarte les enchaînements.
            let s=(load[e]+weights[i])/rel[e]+rng()*0.9;
            if(avoid&&adjacent(A,i,e)) s+=1000;
            if(s<bs){bs=s;best=e;}
          }
          if(best<0) break;
          A[i].push(best); load[best]+=weights[i];
        }
      });
      return A;
    }
    // improve(A) : recherche locale. Modifie A en place, retourne sa note finale.
    //   Deux mouvements, gardés seulement s'ils font baisser la note (sinon annulés) :
    //     remplacement : un agent affecté cède son poste à un autre agent disponible ;
    //     échange : deux agents de deux week-ends différents échangent leurs postes.
    //   On recommence tant qu'une passe a amélioré la note, 40 passes au plus.
    //   Jamais d'agent indisponible, jamais deux fois le même agent sur un week-end, jamais de week-end figé.
    //   Coût en calcul : une passe d'échanges évalue de l'ordre de W x W x k x k plannings.
    function improve(A){
      let c=cost(A), ok=true, passes=0, i, j, s, t, e, a, b, x, y, n, previous;
      while(ok&&passes<40){
        ok=false; passes++;
        // Remplacements : une personne affectée est remplacée par une autre disponible.
        for(i=0;i<W;i++){ if(locked[i]) continue; if(tooLong()) return c; a=A[i];
          for(s=0;s<a.length;s++){ previous=a[s];
            for(e=0;e<E;e++){
              if(e===previous||!avail[i][e]||a.indexOf(e)>=0) continue;
              a[s]=e; n=cost(A);
              if(n<c-1e-9){c=n;ok=true;previous=e;} else a[s]=previous;
            }
          }
        }
        // Échanges : deux personnes affectées à deux week-ends différents échangent leurs week-ends.
        for(i=0;i<W;i++){ if(locked[i]) continue; if(tooLong()) return c;
          for(j=i+1;j<W;j++){ if(locked[j]) continue; a=A[i]; b=A[j];
            for(s=0;s<a.length;s++) for(t=0;t<b.length;t++){
              x=a[s]; y=b[t];
              if(x===y||!avail[j][x]||!avail[i][y]||b.indexOf(x)>=0||a.indexOf(y)>=0) continue;
              a[s]=y; b[t]=x; n=cost(A);
              if(n<c-1e-9){c=n;ok=true;} else {a[s]=x;b[t]=y;}
            }
          }
        }
      }
      return c;
    }
    // Boucle des essais : au moins minAttempts (6), puis tant que le budget de temps et maxAttempts (80)
    // le permettent. Seul le planning de note la plus basse est conservé.
    let bestPlan=null, bestCost=Infinity, attempts=0;
    while(attempts<minAttempts || (attempts<maxAttempts && Date.now()-t0<budget)){
      // En mode adjust : 1er essai depuis le planning actuel, puis essais partiellement perturbés ou repartis de zéro.
      const A=refAsg?(attempts===0?build(ref):attempts%3===0?build():build(ref,0.25)):build();
      const c=improve(A); attempts++;
      if(c<bestCost){bestCost=c; bestPlan=A.map(function(a){return a.slice();});}
    }
    wes.forEach(function(w,i){ res.assignments[w.key]=bestPlan[i].map(function(e){return ids[e];}); });
    res.attempts=attempts; res.cost=bestCost;
    // changes = nombre de week-ends dont la composition diffère de la référence (affiché à l'écran).
    if(refAsg) wes.forEach(function(w,i){ if(bestPlan[i].slice().sort().join()!==ref[i].slice().sort().join()) res.changes++; });
    return res;
  }

  /* ---------- Analyse d'un planning ---------- */
  /* o.year (facultatif, ex. '2027') limite l'analyse aux week-ends de cette année. */
  // ----- Analyse d'un planning : analyze -----
  // analyze(data, asg, o) : statistiques et alertes d'un planning. Lecture seule.
  //   Toutes les charges sont en JOURS.
  //   Par agent : name, since, count (week-ends), holidayCount (dont week-ends avec férié), workload (total des jours), unavailableCount,
  //               share, goal (charge attendue en jours, selon la date d'arrivée), gap (workload - goal).
  //   Global : max, min, average, goalMax, gapMax, gapMin, posts, filled, passes, freeList {samedi: nb disponibles},
  //            gap = gapMax - gapMin : écart entre l'agent le plus au-dessus et le plus en dessous de sa part.
  //            Si tous les agents ont la même part, c'est l'écart entre le plus chargé et le moins chargé.
  //   Alertes, pour les week-ends à venir seulement, triées par gravité :
  //     unavailable .. agent affecté alors qu'il est indisponible, ou avant sa date d'arrivée
  //     duplicate .... agent affecté deux fois au même week-end (signalé aussi pour un week-end passé)
  //     unfilled ..... poste non pourvu
  //     consecutive .. même agent deux week-ends d'affilée
  //   Les week-ends passés comptent dans la charge et les totaux.
  function analyze(data,asg,o){
    o=o||{}; let todayIso=o.today||'', posts=0, filled=0, passes=0;
    let R=data.reglages, wes=periodWeekends(R), k=Math.max(1,R.parWeekend|0), stats={}, alerts=[];
    if(o.year) wes=wes.filter(function(w){return w.year===String(o.year);});
    data.salaries.forEach(function(s){
      let count=0; (data.indispos[s.id]||[]).forEach(function(c){ if(wes.some(function(w){return w.key===c;})) count++; });
      let share=0; wes.forEach(function(w){ if(isPresent(s,w.key)) share+=w.days; });
      stats[s.id]={id:s.id, name:s.nom, count:0, holidayCount:0, workload:0, unavailableCount:count, since:s.depuis||'', share:share, goal:0, gap:0};
    });
    const freeList={};
    wes.forEach(function(w,i){
      const a=(asg[w.key]||[]).filter(function(id){return id && stats[id];});
      freeList[w.key]=data.salaries.filter(function(s){return isPresent(s,w.key)&&(data.indispos[s.id]||[]).indexOf(w.key)<0;}).length;
      const seen={}, past=!!todayIso&&w.key<=todayIso; if(past) passes++;
      a.forEach(function(id){
        if(seen[id]){ alerts.push({type:'duplicate',key:w.key,msg:w.label+' : '+stats[id].name+' est affecté(e) deux fois'}); return; }
        seen[id]=1;
        const st=stats[id]; st.count++; st.workload+=w.days; if(w.holidays.length) st.holidayCount++;
        if(!past&&(data.indispos[id]||[]).indexOf(w.key)>=0) alerts.push({type:'unavailable',key:w.key,msg:w.label+' : '+st.name+' est affecté(e) alors qu’il/elle est indisponible'});
        if(!past&&st.since&&w.key<st.since) alerts.push({type:'unavailable',key:w.key,msg:w.label+' : '+st.name+' est affecté(e) avant son arrivée'});
        if(!past&&w.continuesPrev && (asg[addDays(w.key,-7)]||[]).indexOf(id)>=0) alerts.push({type:'consecutive',key:w.key,msg:w.label+' : '+st.name+' est de permanence deux week-ends d’affilée'});
      });
      const n=Object.keys(seen).length;
      posts+=k; filled+=Math.min(k,n);
      if(n<k&&!past) alerts.push({type:'unfilled',key:w.key,msg:w.label+' : '+(k-n)+' poste'+(k-n>1?'s':'')+' non pourvu'+(k-n>1?'s':'')+(freeList[w.key]<k?' ('+freeList[w.key]+' agent'+(freeList[w.key]>1?'s':'')+' disponible'+(freeList[w.key]>1?'s':'')+')':'')});
    });
    const rows=data.salaries.map(function(s){return stats[s.id];});
    const loads=rows.map(function(s){return s.workload;});
    const max=loads.length?Math.max.apply(null,loads):0, min=loads.length?Math.min.apply(null,loads):0;
    const order={unavailable:0,duplicate:1,unfilled:2,consecutive:3};
    alerts.sort(function(a,b){return (order[a.type]-order[b.type])||(a.key<b.key?-1:a.key>b.key?1:0);});
    const tot=loads.reduce(function(x,y){return x+y;},0), avg=loads.length?tot/loads.length:0;
    let shareSum=rows.reduce(function(x,s){return x+s.share;},0), goalMax=0, gapMax=-Infinity, gapMin=Infinity;
    rows.forEach(function(s){
      s.goal=shareSum>0?tot*s.share/shareSum:0; s.gap=s.workload-s.goal;
      if(s.goal>goalMax) goalMax=s.goal; if(s.gap>gapMax) gapMax=s.gap; if(s.gap<gapMin) gapMin=s.gap;
    });
    if(!rows.length){ gapMax=0; gapMin=0; }
    return {weekends:wes, stats:rows, alerts:alerts, max:max, min:min, average:avg, goalMax:goalMax, gapMax:gapMax, gapMin:gapMin,
            gap:Math.round((gapMax-gapMin)*100)/100, freeList:freeList, posts:posts, filled:filled, passes:passes};
  }

  // Interface publique de Core : tout ce qui n'est pas listé ici est inaccessible depuis l'extérieur.
  return {MONTHS:MONTHS, today:today, parseISO:parseISO, toISO:toISO, addDays:addDays, isValidIso:isValidIso, clone:clone,
    longDate:longDate, frDate:frDate, shortDay:shortDay, weekendLabel:weekendLabel, monthLabel:monthLabel, frNumber:frNumber,
    easter:easter, holidays:holidays, holidayName:holidayName, periodWeekends:periodWeekends,
    newData:newData, normalize:normalize, serialize:serialize, findEmployee:findEmployee,
    splitNames:splitNames, nameKey:nameKey, applyOp:applyOp, opKey:opKey, isPresent:isPresent,
    Store:Store, propose:propose, analyze:analyze, LOG_FILE:LOG_FILE, logLine:logLine, lineId:lineId, LOG_MODEL:LOG_MODEL};
})();
/*CORE-FIN*/
</script>

<script>
// SCRIPT 3 / 3 : Interface.
// =====================================================================================
// Fonction auto-exécutée : aucune variable globale. Seul lien avec le script précédent : l'objet Core.
// ARCHITECTURE
//   État unique S . render() reconstruit l'écran depuis S . un écouteur « click » et un écouteur
//   « change » sur le document appellent les tables actions et changes.
//   Toute modification de données passe par execute(op), qui appelle Core.applyOp puis Store.
// RÈGLE DE SÉCURITÉ DE L'AFFICHAGE
//   L'écran est produit par concaténation de chaînes puis innerHTML. Toute valeur qui vient du fichier
//   ou d'une saisie (nom d'agent, titre, nom de dossier, message) DOIT passer par esc().
//   Sont insérés sans esc() uniquement : des constantes du code, des nombres, des dates calculées,
//   des identifiants de classes CSS pris dans une liste fixe.
/* ---------- Interface ---------- */
(function(){
'use strict';
const C=Core;
const app=document.getElementById('app');
// FS_OK : le navigateur sait-il ouvrir un dossier en écriture ? Sinon, écran « incompatible ».
// DATA_FILE : nom imposé du fichier de données. Aucun nom de fichier ne vient de l'utilisateur.
const FS_OK=typeof window.showDirectoryPicker==='function';
const DATA_FILE='permanences-donnees.json';

// esc : ÉCHAPPEMENT HTML. Neutralise & < > " ' : la valeur est sûre dans le texte d'une balise et dans
// un attribut entre guillemets. C'est la barrière contre l'injection de code par un nom d'agent, un titre
// ou un fichier de données modifié à la main.
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
// LS : accès à localStorage, préfixe « permanences. ». Clés : admin, employee, theme.
// Préférences d'affichage du poste, sans donnée de planning. Toute erreur de stockage est ignorée.
const LS={
  get:function(k,d){ try{ const v=localStorage.getItem('permanences.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem('permanences.'+k,JSON.stringify(v)); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem('permanences.'+k); }catch(e){} }
};
// uid : identifiant d'agent ou d'opération (horloge + hasard). Sert à distinguer, pas à protéger :
// il n'est ni secret ni imprévisible.
function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function timeStr(d){ d=d||new Date(); return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function dateTimeStr(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function plural(n,singular,pluralForm){ return n+' '+(n>1?(pluralForm||singular+'s'):singular); }
// inDays : affichage d'une charge ou d'un écart, toujours exprimés en jours de permanence.
function inDays(n){ return C.frNumber(n)+' j'; }
// signedDays : écart signé, « +1,5 », « −0,5 » ou « 0 ».
function signedDays(n){ const r=Math.round(n*100)/100; return r>0?'+'+C.frNumber(r):r<0?'−'+C.frNumber(-r):'0'; }

/* --- IndexedDB : mémorise le lien vers le dossier --- */
// IndexedDB, base « permanences-weekend », magasin « kv », une seule clé « folder » : l'objet remis par
// Edge qui désigne le dossier choisi. Ce n'est pas un chemin et il ne donne aucun droit par lui-même :
// Edge redemande l'accord de l'utilisateur selon sa propre politique.
function idb(){ return new Promise(function(res,rej){ const r=indexedDB.open('permanences-weekend',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
function idbOp(mode,fn){
  // Délai de garde : si IndexedDB ne répond pas, on continue sans mémoriser le fichier.
  const guard=new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('IndexedDB ne répond pas')); },3000); });
  return Promise.race([guard, idb().then(function(db){ return new Promise(function(res,rej){ const t=db.transaction('kv',mode), q=fn(t.objectStore('kv')); t.oncomplete=function(){res(q&&q.result);}; t.onerror=function(){rej(t.error);}; }); })]);
}
function idbGet(k){ return idbOp('readonly',function(s){return s.get(k);}); }
function idbSet(k,v){ return idbOp('readwrite',function(s){return s.put(v,k);}); }
function idbDel(k){ return idbOp('readwrite',function(s){return s.delete(k);}); }

/* Lecture / écriture d'un fichier du dossier partagé (fichier absent = texte vide). */
// fileIo : SEUL accès en lecture et en écriture aux fichiers, pour un nom fixé par le code
// (DATA_FILE ou Core.LOG_FILE), dans le dossier autorisé. Un fichier absent se lit comme un texte vide.
// L'écriture remplace le fichier entier ; Edge écrit dans un fichier temporaire puis le substitue à la
// fermeture, et abort() abandonne l'écriture en cas d'erreur.
function fileIo(dirHandle,fullName){
  return {
    read:async function(){
      try{ const h=await dirHandle.getFileHandle(fullName); return await (await h.getFile()).text(); }
      catch(e){ if(e&&e.name==='NotFoundError') return ''; throw e; }
    },
    write:async function(txt){
      const h=await dirHandle.getFileHandle(fullName,{create:true}), w=await h.createWritable();
      try{ await w.write(txt); await w.close(); }catch(e){ try{ await w.abort(); }catch(_){} throw e; }
    }
  };
}
// pageName : nom de fichier de la page, lu dans son adresse. Sert uniquement à vérifier que le dossier
// choisi est bien celui de la page, et à l'afficher (échappé).
function pageName(){ try{ return decodeURIComponent(location.pathname.split('/').pop()||''); }catch(e){ return ''; } }

/* --- État --- */
// État de l'écran. Rien de cet état n'est partagé avec les autres postes, sauf data (image du fichier).
const S={
  mode:'booting', // booting | incompatible | home | reconnect | fs
  data:null, store:null, dirHandle:null, folderName:'',
  admin:!!LS.get('admin',false),
  tab:'overview', // chaque ouverture commence sur la vue d'ensemble
  employee:LS.get('employee',''),
  year:null,       // année affichée ('2027'…), 'all' pour toute la période, null = année en cours par défaut
  theme:(function(){ const t=LS.get('theme','auto'); return t==='light'||t==='dark'?t:'auto'; })(),
  logStore:null,
  preview:null,      // {assignments:{}, locks:{key:true}, mode:'adjust'|'complete'|'manual'}
  status:{txt:'',type:''},
  lastRead:null, computing:false, proposalInfo:''
};
// Nettoyage : une ancienne version mémorisait un identifiant de poste. Il n'est plus ni utilisé ni conservé.
LS.del('poste'); // ancien identifiant de poste, plus utilisé
// TABS : adminOnly = visible seulement quand l'interrupteur « Administration » est activé.
const TABS=[
  {id:'entry',name:'Mes indisponibilités',ico:'cal'},
  {id:'overview',name:'Vue d’ensemble',ico:'grid'},
  {id:'schedule',name:'Planning',ico:'list'},
  {id:'employees',name:'Agents',ico:'users',adminOnly:true},
  {id:'settings',name:'Réglages',ico:'gear',adminOnly:true}
];
// status : message de la ligne d'état. Écrit par textContent, donc sans interprétation HTML.
function status(txt,type){ S.status={txt:txt,type:type||''}; const el=document.getElementById('status'); if(el){ el.textContent=txt; el.title=txt; el.className='status status-'+(type||''); } }

/* --- Démarrage et connexion au dossier --- */
// showError : signale un échec. Message dans la ligne d'état ; hors de l'écran principal, où cette ligne
// n'existe pas, le message est aussi présenté dans une boîte de dialogue.
function showError(msg,e){
  const txt=msg+' ('+((e&&e.message)||e)+').';
  console.warn(msg,e);
  status(txt,'error');
  if(S.mode!=='fs') alert(txt);
}
// boot : au chargement. Si un dossier est mémorisé et que l'accord d'Edge est toujours valide,
// connexion directe ; s'il faut redonner l'accord, écran « reconnexion » ; sinon écran d'accueil.
async function boot(){
  if(!FS_OK){ S.mode='incompatible'; render(); return; }
  try{
    const d=await idbGet('folder');
    if(d){
      S.dirHandle=d; S.folderName=d.name;
      if(await d.queryPermission({mode:'readwrite'})==='granted'){ await connect(d); return; }
      S.mode='reconnect'; render(); return;
    }
  }catch(e){ console.warn(e); }
  S.mode='home'; render();
}
// connect : crée le Store du fichier de données, fait la première lecture et mémorise le dossier.
async function connect(dirHandle){
  S.dirHandle=dirHandle; S.folderName=dirHandle.name; S.logStore=null;
  S.store=new C.Store(fileIo(dirHandle,DATA_FILE),{
    onRepair:function(view){ S.data=view; status('Saisie simultanée fusionnée, vérification en cours… Gardez la page ouverte.','info'); render(); },
    // onIdle : toutes les saisies de ce poste sont écrites et revérifiées ; la page peut être fermée.
    onIdle:function(b){
      if(b.abandons) status('Une saisie n’a pas pu être enregistrée : le fichier est trop sollicité ou inaccessible. Rechargez et vérifiez vos dernières saisies.','error');
      else status('Enregistré et vérifié à '+timeStr()+(b.merges?' (une saisie simultanée a été fusionnée)':''),'ok');
    },
    onLog:appendToLog
  });
  status('Lecture du fichier…','info');
  S.data=await S.store.loadData();
  S.lastRead=new Date().toISOString();
  S.mode='fs';
  idbSet('folder',dirHandle).catch(function(e){ console.warn('Impossible de mémoriser le dossier',e); });
  status('Données chargées à '+timeStr(),'ok');
  render();
}
/* Un seul bouton : on choisit le dossier partagé. Si le fichier de données existe, on l'ouvre ;
   sinon (toute première fois) on propose de le créer. Rien n'est jamais écrasé. */
// openFolder : ouvre le sélecteur de dossier d'Edge (c'est l'utilisateur qui choisit et qui accorde
// l'écriture). Trois garde-fous : avertissement si la page n'est pas dans ce dossier ; refus d'ouvrir un
// fichier de données illisible, sans rien écrire ; création d'un fichier neuf seulement s'il n'en existe
// aucun et après confirmation.
async function openFolder(){
  try{
    const dirHandle=await window.showDirectoryPicker({mode:'readwrite',id:'permanences'});
    const page=pageName();
    if(page){
      let pageHere=true; try{ await dirHandle.getFileHandle(page); }catch(e){ pageHere=false; }
      if(!pageHere && !confirm('Ce dossier ne contient pas la page « '+page+' ».\nLes données et le journal doivent être dans le même dossier que la page.\n\nUtiliser quand même ce dossier ?')) return;
    }
    let txt=null;
    try{ txt=await (await (await dirHandle.getFileHandle(DATA_FILE)).getFile()).text(); }
    catch(e){ if(!e||e.name!=='NotFoundError') throw e; }
    if(txt!==null){
      let valid=false; try{ C.normalize(JSON.parse(txt)); valid=true; }catch(e){}
      if(!valid){ alert('Le fichier '+DATA_FILE+' de ce dossier est vide ou illisible.\nRien n’a été modifié. Vérifiez-le (ou restaurez une sauvegarde) avant de recommencer.'); return; }
      await connect(dirHandle); return;
    }
    if(!confirm('Aucun fichier de données dans ce dossier.\n\nS’agit-il de la toute première mise en place ? Le fichier '+DATA_FILE+' va être créé ici (à faire une seule fois, par l’administration).')) return;
    const init=C.newData();
    C.applyOp(init,{type:'creation',id:uid(),at:new Date().toISOString(),author:'Administration'});
    const entries=init.journal; init.journal=[];
    await fileIo(dirHandle,DATA_FILE).write(C.serialize(init));
    S.admin=true; LS.set('admin',true); S.tab='employees';
    await connect(dirHandle);
    appendToLog(entries);
    status('Fichier créé. Commencez par ajouter les agents.','ok');
  }catch(e){ if(e&&e.name==='AbortError') return; showError('Impossible d’ouvrir le dossier',e); }
}
// reconnect : redemande à Edge l'accord d'écriture sur le dossier mémorisé.
async function reconnect(){
  try{
    const p=await S.dirHandle.requestPermission({mode:'readwrite'});
    if(p==='granted') await connect(S.dirHandle);
    else status('Accès refusé par le navigateur.','error');
  }catch(e){ showError('Le dossier mémorisé est introuvable (déplacé, renommé ou partage indisponible). Ouvrez-le à nouveau',e); S.mode='home'; render(); }
}
// changeFolder : oublie le dossier mémorisé et revient à l'accueil. Ne supprime aucun fichier.
async function changeFolder(){
  try{ await idbDel('folder'); }catch(e){}
  S.dirHandle=null; S.store=null; S.data=null; S.preview=null; S.logStore=null; S.mode='home'; status('','');
  render();
}

/* --- Journal : fichier permanences.log dans le même dossier --- */
// appendToLog : écrit les entrées dans permanences.log par un second Store (même protection contre
// les écritures simultanées). Un échec est signalé dans la ligne d'état, sans bloquer la saisie.
function appendToLog(entries){
  if(!S.dirHandle||!entries||!entries.length) return;
  if(!S.logStore) S.logStore=new C.Store(fileIo(S.dirHandle,C.LOG_FILE),{model:C.LOG_MODEL});
  S.logStore.execute({type:'log',id:uid(),lines:entries.map(C.logLine)}).catch(function(e){ status('Le fichier '+C.LOG_FILE+' n’a pas pu être mis à jour ('+(e.message||e)+')','error'); });
}

let reloading=false;
// reload : relit le fichier pour afficher les saisies des collègues. Appelé au retour sur la fenêtre,
// au retour sur l'onglet, toutes les 30 secondes, et par le bouton « Recharger ».
async function reload(manual){
  if(S.mode!=='fs'||!S.store||reloading) return;
  reloading=true;
  try{
    const d=await S.store.loadData();
    S.lastRead=new Date().toISOString();
    const change=C.serialize(d)!==C.serialize(S.data);
    S.data=d;
    if(manual) status('Données rechargées à '+timeStr(),'ok');
    if(change||manual) render();
  }catch(e){
    if(e&&e.name==='NotAllowedError'){ S.mode='reconnect'; render(); }
    else status('Lecture impossible ('+(e.message||e)+'). Vérifiez l’accès au dossier partagé.','error');
  }finally{ reloading=false; }
}
window.addEventListener('focus',function(){ reload(false); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden) reload(false); });
setInterval(function(){ if(!document.hidden) reload(false); },30000);

/* --- Exécution d'une modification --- */
// execute(op) : PASSAGE OBLIGÉ DE TOUTE MODIFICATION DE DONNÉES.
//   Horodate l'opération, lui donne un identifiant et un rôle (« Administration » ou « Agent », selon
//   l'interrupteur : ni nom de personne, ni nom de poste). L'applique à l'écran tout de suite, puis
//   l'écrit par le Store. En cas d'échec d'écriture, le Store réessaie seul.
//   Ligne d'état : « Enregistrement… », puis « vérification en cours », puis « Enregistré et vérifié »
//   (voir onIdle dans connect) : ce dernier message indique que la page peut être fermée.
async function execute(op){
  op.at=op.at||new Date().toISOString();
  op.id=op.id||uid();
  op.author=S.admin?'Administration':'Agent'; // rôle seulement : ni nom, ni poste
  C.applyOp(S.data,op); // affichage immédiat
  status('Enregistrement…','info'); render();
  try{
    const shown=S.data;
    S.data=await S.store.execute(op);
    if(S.store.busy()) status('Enregistré, vérification… gardez la page ouverte','info');
    // L'écran montre déjà la saisie : on ne le reconstruit que si le fichier apporte autre chose
    // (saisie d'un collègue). Sinon un clic en cours sur un autre week-end pourrait être perdu.
    if(sameContent(shown,S.data)) return;
  }catch(e){
    if(e&&e.name==='NotAllowedError'){ S.mode='reconnect'; render(); return; }
    status('Enregistrement retardé ('+(e.message||e)+') : nouvel essai automatique dans quelques secondes.','error');
    try{ S.data=await S.store.loadData(); }catch(_){}
  }
  render();
}
// sameContent : mêmes données affichées, sans tenir compte de l'heure d'écriture ni du journal.
function sameContent(a,b){
  // Clés triées : l'ordre des clés peut différer entre la copie locale et le fichier relu.
  function key(d){ return JSON.stringify(d,function(k,v){
    if(k==='majLe'||k==='journal') return undefined;
    if(v&&typeof v==='object'&&!Array.isArray(v)){ const o={}; Object.keys(v).sort().forEach(function(x){ o[x]=v[x]; }); return o; }
    return v;
  }); }
  return !!a&&!!b&&key(a)===key(b);
}

/* --- Téléchargement (sauvegarde JSON) --- */
// downloadFile : sauvegarde. Fabrique un fichier en mémoire et le remet au navigateur, qui l'enregistre
// sur le poste. Aucun envoi réseau. Le fichier sort alors du dossier partagé et de ses droits d'accès.

  const b=new Blob([content],{type:type}), u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=fullName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},2000);
}
/* --- Helpers d'affichage --- */

function ico(n,cls){ return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICO[n]||'')+'</svg>'; }
// tint, initials, avatar, chip : pastille colorée d'un agent. La couleur est déduite du nom ; le nom
// et les initiales sont échappés.
function tint(n){ let h=0; n=String(n); for(let i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))%360; return h; }
function initials(n){ const p=String(n).trim().split(/\s+/).map(function(w){return w.replace(/[^\p{L}]/gu,'');}).filter(Boolean); if(!p.length) return '?'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):(p[0][1]||''))).toUpperCase(); }
function avatar(n,cls){ return '<span class="avatar'+(cls?' '+cls:'')+'" style="--h:'+tint(n)+'" aria-hidden="true">'+esc(initials(n))+'</span>'; }
function chip(n,cls,titleText){ return '<span class="chip'+(cls?' '+cls:'')+'"'+(titleText?' title="'+esc(titleText)+'"':'')+'>'+avatar(n)+'<span>'+esc(n)+'</span></span>'; }
// button : produit un bouton portant data-action ; le clic est traité par la table actions.
function button(action,icon,detail,style,opts){
  opts=opts||{};
  const calc=S.computing&&(action==='adjust'||action==='propose-full');
  const off=opts.disabled||calc;
  return '<button class="btn btn-'+style+(opts.small?' btn-small':'')+'" data-action="'+action+'"'+(opts.id?' data-id="'+esc(opts.id)+'"':'')+(opts.titre?' title="'+esc(opts.titre)+'"':'')+(off?' disabled':'')+'>'+ico(icon)+'<span>'+esc(calc&&S.computing===action?'Calcul en cours…':detail)+'</span></button>';
}
function kpi(caption,val,sub,tone){ return '<div class="kpi '+(tone||'')+'"><span class="kpi-l">'+esc(caption)+'</span><span class="kpi-v">'+esc(val)+'</span><span class="kpi-s">'+esc(sub)+'</span></div>'; }
function empty(icon,titleText,detail){ return '<div class="card state-empty">'+ico(icon)+'<b>'+esc(titleText)+'</b><p class="help">'+esc(detail)+'</p></div>'; }
// Raccourcis de lecture de l'état (weekends à sortedAgents). Aucune modification de données.
function weekends(){ return C.periodWeekends(S.data.reglages); }
function nameOf(id){ const s=C.findEmployee(S.data,id); return s?s.nom:''; }
function byMonth(wes){ let g=[],cur=null; wes.forEach(function(w){ if(!cur||cur.month!==w.month){ cur={month:w.month,wes:[]}; g.push(cur); } cur.wes.push(w); }); return g; }
function holidayTags(w){ return w.holidays.map(function(f){ return '<span class="tag tag-holiday" title="Jour férié">'+esc(f.name)+' · '+esc(C.shortDay(f.date))+'</span>'; }).join(' '); }
function shownAsg(){ return S.preview?S.preview.assignments:S.data.planning.affectations; }
function hasSchedule(){ const a=S.data.planning.affectations; return Object.keys(a).some(function(k){return a[k].some(Boolean);}); }
function perWeekend(){ return Math.max(1,S.data.reglages.parWeekend|0); }
// isUnavailable : indisponibilité déclarée, ou agent pas encore arrivé à cette date.
function isUnavailable(id,key){ const s=C.findEmployee(S.data,id); return (!!s&&!C.isPresent(s,key)) || (S.data.indispos[id]||[]).indexOf(key)>=0; }
function sortedAgents(){ return S.data.salaries.slice().sort(function(a,b){return a.nom.localeCompare(b.nom,'fr');}); }
/* --- Années : la période peut couvrir plusieurs années ; on en affiche une à la fois (l'année en cours par défaut). --- */
// years, shownYear, shownWeekends, scope, yearNav : affichage d'une année à la fois quand la période
// en couvre plusieurs. Simple filtre d'affichage : le calcul de répartition porte toujours sur tout.
function years(){ const seen={}, r=[]; weekends().forEach(function(w){ if(!seen[w.year]){ seen[w.year]=1; r.push(w.year); } }); return r; }
function shownYear(){
  const ys=years();
  if(ys.length<2||S.year==='all') return null;            // une seule année, ou « toute la période »
  if(S.year&&ys.indexOf(S.year)>=0) return S.year;
  const a=C.today().slice(0,4);                          // par défaut : l'année en cours, sinon la plus proche
  return ys.indexOf(a)>=0?a:(a<ys[0]?ys[0]:ys[ys.length-1]);
}
function shownWeekends(){ const a=shownYear(), w=weekends(); return a?w.filter(function(x){return x.year===a;}):w; }
function scope(){ const a=shownYear(), R=S.data.reglages; return a?'Année '+a:'Du '+C.longDate(R.debut)+' au '+C.longDate(R.fin); }
function yearNav(){
  const ys=years(); if(ys.length<2) return '';
  const a=shownYear(), i=a?ys.indexOf(a):-1;
  let h='<div class="nav-year no-print" role="group" aria-label="Année affichée">'+
    '<button class="btn btn-sec btn-small" data-action="year-nav" data-id="-1" title="Année précédente" aria-label="Année précédente"'+(i<=0?' disabled':'')+'>'+ico('left')+'</button>'+
    '<select data-change="year" aria-label="Année affichée">';
  ys.forEach(function(y){ h+='<option value="'+y+'"'+(y===a?' selected':'')+'>'+y+'</option>'; });
  h+='<option value="all"'+(!a?' selected':'')+'>Toute la période</option></select>'+
    '<button class="btn btn-sec btn-small" data-action="year-nav" data-id="1" title="Année suivante" aria-label="Année suivante"'+(i<0||i>=ys.length-1?' disabled':'')+'>'+ico('right')+'</button></div>';
  return h;
}
// themePicker : les trois boutons de thème (automatique, clair, sombre).
function themePicker(){
  const opts=[['auto','auto','Thème automatique (comme Windows)'],['light','sun','Thème clair'],['dark','moon','Thème sombre']];
  return '<span class="theme-choice no-print" role="group" aria-label="Thème">'+opts.map(function(o){
