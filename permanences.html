/* --- Impression / PDF --- */
// Impression et PDF : passent par la fenêtre d'impression du navigateur. Aucun fichier n'est créé par la page.
function nowDate(){ return dateTimeStr(new Date().toISOString()); }
function updatePrintDates(){ const t=nowDate(); document.querySelectorAll('.date-print').forEach(function(el){ el.textContent=t; }); }
/* Le titre du document sert de nom de fichier proposé par « Enregistrer au format PDF ». */
function printWithTitle(titleText,before,after){
  let previous=document.title, done=false;
  function endDate(){ if(done) return; done=true; window.removeEventListener('afterprint',endDate); document.title=previous; if(after) after(); }
  if(before) before();
  document.title=titleText+' - '+C.today();
  window.addEventListener('afterprint',endDate);
  window.print(); // Edge émet afterprint à la fermeture de la fenêtre d'impression
}
function printPage(){
  const names={overview:'Vue d’ensemble',planning:'Planning'};
  updatePrintDates();
  printWithTitle((names[S.tab]||'Permanences')+' - '+S.data.reglages.titre+(shownYear()?' - '+shownYear():''));
}
/* Fiche « Mes indisponibilités » d'un agent, une page A4 par agent, avec la date de l'export. */
// agentSheet : contenu HTML de la fiche d'un agent. Les noms et libellés sont échappés.
function agentSheet(s,wes,at){
  wes=wes.filter(function(w){ return C.isPresent(s,w.key); }); // week-ends depuis l'arrivée de l'agent
  const unav={}; (S.data.indispos[s.id]||[]).forEach(function(c){unav[c]=1;});
  let asg=S.data.planning.affectations, todayIso=C.today(), unavCount=0, dutyCount=0, month='';
  byMonth(wes).forEach(function(g){
    month+='<div class="sheet-month"><h3>'+esc(C.monthLabel(g.month))+'</h3><ul>';
    g.wes.forEach(function(w){
      const i=!!unav[w.key], p=(asg[w.key]||[]).indexOf(s.id)>=0, wd=weekendDays(w);
      if(i) unavCount++; if(p) dutyCount++;
      month+='<li class="'+(i?'unav':'free')+(w.key<=todayIso?' past':'')+'"><span class="sheet-days">'+esc(wd.days)+(wd.month.indexOf('–')>=0?' <small>'+esc(wd.month)+'</small>':'')+'</span>'+
        '<span class="sheet-state">'+(i?'Indisponible':'Disponible')+'</span>'+(p?'<span class="sheet-duty">Permanence</span>':'')+
        (w.holidays.length?'<span class="sheet-holidays">'+esc(w.holidays.map(function(f){return f.name+' ('+C.shortDay(f.date)+')';}).join(', '))+'</span>':'')+'</li>';
    });
    month+='</ul></div>';
  });
  return '<section class="sheet">'+
    '<header class="sheet-head"><div><div class="sheet-kicker">'+esc(S.data.reglages.titre)+'</div><h1>'+esc(s.nom)+'</h1><div class="sheet-scope">Indisponibilités · '+esc(scope())+'</div></div>'+
    '<div class="sheet-date">Exporté le<b>'+esc(at)+'</b></div></header>'+
    '<div class="sheet-stats"><span><b>'+unavCount+'</b>indisponible'+(unavCount>1?'s':'')+'</span><span><b>'+(wes.length-unavCount)+'</b>disponible'+(wes.length-unavCount>1?'s':'')+'</span><span><b>'+dutyCount+'</b>permanence'+(dutyCount>1?'s':'')+'</span></div>'+
    '<div class="sheet-legend"><span><i style="background:#fde4e1;border-left:3pt solid #c42b1c"></i>Indisponible</span><span><i style="background:#e6f4ec;border-left:3pt solid #107c41"></i>Disponible</span><span><i style="background:#0f6cbd"></i>De permanence</span><span style="color:#6f3aa6">Violet : jour férié</span></div>'+
    '<div class="sheet-grid">'+month+'</div>'+
    '<footer class="sheet-foot"><span>'+esc(s.nom)+' · '+esc(scope())+'</span><span>Exporté le '+esc(at)+'</span></footer></section>';
}
// fillSheets et clearSheets : la zone d'impression n'est remplie que le temps de l'impression.
function fillSheets(agents){
  const wes=shownWeekends(), at=nowDate();
  document.getElementById('print-area').innerHTML=agents.map(function(s){ return agentSheet(s,wes,at); }).join('');
  document.body.classList.add('print-zone');
}
function clearSheets(){ document.body.classList.remove('print-zone'); document.getElementById('print-area').innerHTML=''; }
function printSheets(agents,titleText){
  if(!agents.length) return;
  printWithTitle(titleText+(shownYear()?' - '+shownYear():''),function(){ fillSheets(agents); },clearSheets);
}
/* Ctrl+P depuis « Mes indisponibilités » imprime aussi la fiche de l'agent choisi. */
let autoSheet=false;
window.addEventListener('beforeprint',function(){
  updatePrintDates();
  if(document.body.classList.contains('print-zone')||S.mode!=='fs'||S.tab!=='entry') return;
  const s=C.findEmployee(S.data,S.employee); if(!s) return;
  fillSheets([s]); autoSheet=true;
});
window.addEventListener('afterprint',function(){ if(autoSheet){ autoSheet=false; clearSheets(); } });

// weekendDays : libellé court d'un week-end (« 2–3 », « janv. »).
function weekendDays(w){
  const a=C.parseISO(w.key), b=C.parseISO(w.sunday), m=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  if(a.getUTCMonth()===b.getUTCMonth()) return {days:a.getUTCDate()+'–'+b.getUTCDate(),month:m[a.getUTCMonth()]};
  return {days:a.getUTCDate()+'–'+b.getUTCDate(),month:m[a.getUTCMonth()]+' – '+m[b.getUTCMonth()]};
}

/* --- Rendu --- */
// render : reconstruit tout l'écran depuis l'état S. Préserve ce qui est en cours de frappe
// (champs marqués data-keep) et le champ actif.
function render(){
  // Conserver ce que l'utilisateur est en train de taper
  const guard={}, active=document.activeElement, focus=active&&active.id;
  // Bouton de week-end actif : on le retrouve après reconstruction grâce à data-we.
  const focusWe=active&&active.dataset&&active.dataset.action==='toggle'?active.dataset.we:null;
  const sx=window.scrollX, sy=window.scrollY;
  document.querySelectorAll('[data-keep]').forEach(function(el){ if(el.value!==el.defaultValue) guard[el.id]=el.value; });
  app.innerHTML=view();
  Object.keys(guard).forEach(function(id){ const el=document.getElementById(id); if(el) el.value=guard[id]; });
  if(focus){ const f=document.getElementById(focus); if(f&&f.focus&&f.tagName!=='BUTTON'){ f.focus({preventScroll:true}); if(f.type==='text'&&f.setSelectionRange){ const n=f.value.length; f.setSelectionRange(n,n); } } }
  if(focusWe){ const t=app.querySelector('[data-action="toggle"][data-we="'+focusWe+'"]'); if(t) t.focus({preventScroll:true}); }
  // Tout l'écran est reconstruit : on remet la page exactement où elle était.
  if(window.scrollX!==sx||window.scrollY!==sy) window.scrollTo(sx,sy);
  if(S.data) document.title=S.data.reglages.titre;
}
// view : aiguillage. Écrans de connexion, ou barre de titre + ligne d'état + onglets + onglet courant.

  if(S.mode==='booting') return '<div class="home"><p class="help" style="text-align:center">Chargement…</p></div>';
  if(S.mode==='incompatible') return incompatibleView();
  if(S.mode==='home') return homeView();
  if(S.mode==='reconnect') return reconnectView();
  if(!S.admin && TABS.some(function(o){return o.id===S.tab&&o.adminOnly;})) S.tab='entry';
  const R=S.data.reglages, wes=weekends();
  let h='<header class="bar"><div class="bar-inner">'+
    '<div class="brand"><span class="logo">'+ico('cal')+'</span><div style="min-width:0"><h1>'+esc(R.titre)+'</h1>'+
    '<div class="sub-title">'+esc(C.longDate(R.debut))+' – '+esc(C.longDate(R.fin))+'</div></div></div>'+
    '<div class="bar-right no-print">'+
      '<label class="switch" title="Affiche les fonctions de gestion (agents, réglages, planning)"><input type="checkbox" data-change="admin"'+(S.admin?' checked':'')+'><span class="track"></span><span>Administration</span></label>'+themePicker()+
    '</div></div></header>';
  h+='<div class="container">';
  h+='<div class="state no-print"><span class="state-file" title="Données et journal sont dans ce dossier">'+ico('folder')+'<b>'+esc(S.folderName)+'</b><span>›</span>'+ico('file')+'<b>'+DATA_FILE+'</b></span>'+
    '<span id="status" class="status status-'+S.status.type+'" title="'+esc(S.status.txt)+'">'+esc(S.status.txt)+'</span>'+
    '<span class="state-links"><button class="link" data-action="reload">'+ico('refresh')+'Recharger</button><button class="link" data-action="change-file">'+ico('folder')+'Changer de dossier</button></span></div>';
  h+='<nav class="tabs no-print" aria-label="Sections"><div class="tabs-inner">';
  let sepDone=false;
  TABS.forEach(function(o){
    if(o.adminOnly&&!S.admin) return;
    if(o.adminOnly&&!sepDone){ h+='<span class="sep" aria-hidden="true"></span>'; sepDone=true; }
    h+='<button data-action="tab" data-id="'+o.id+'"'+(S.tab===o.id?' aria-current="page"':'')+'>'+ico(o.ico)+'<span>'+esc(o.name)+'</span>'+(o.id==='schedule'&&S.preview?'<span class="tag tag-warn">aperçu</span>':'')+'</button>';
  });
  h+='</div></nav>';
  h+='<div class="print-only print-meta"><span>'+esc(scope())+'</span><span>Édité le <span class="date-print">'+esc(dateTimeStr(new Date().toISOString()))+'</span></span></div>';
  h+='<main'+(S.tab==='overview'?' class="landscape"':'')+'>';
  if(!wes.length) h+='<div class="banner error">'+ico('alert')+'<div>La période définie dans les réglages ne contient aucun week-end complet.</div></div>';
  switch(S.tab){
    case 'overview': h+=overviewView(); break;
    case 'schedule': h+=scheduleView(); break;
    case 'employees': h+=agentsView(); break;
    case 'settings': h+=settingsView(); break;
    default: h+=entryView();
  }
  h+='</main></div>';
  return h;
}

// overviewView : tableau agents x week-ends. Lecture seule.
function overviewView(){

  let unfilledCount=0, bodyHtml='';
  byMonth(wes).forEach(function(g){
    bodyHtml+='<tr class="month-row"><th colspan="'+(emps.length+2)+'">'+esc(C.monthLabel(g.month))+'</th></tr>';
    g.wes.forEach(function(w){
      let a=asg[w.key]||[], freeN=0, cells='';

               unav?'<span class="pt pt-unavailable" title="'+esc(s.nom)+' : indisponible">'+ico('x')+'</span>':

  let h='<div class="head-section"><div><h2>Vue d’ensemble</h2><p class="help">Indisponibilités et permanences de tous les agents'+(S.preview?' (permanences de l’aperçu non enregistré)':'')+'.</p></div>'+

             '<div class="banner info">'+ico('check')+'<div>Chaque week-end a au moins '+plural(perWk,'agent')+' disponible'+(perWk>1?'s':'')+'.</div></div>';
  h+='<div class="card"><div class="legend"><span><span class="pt pt-unavailable">'+ico('x')+'</span>indisponible</span><span><span class="pt pt-duty">P</span>de permanence</span><span><span class="pt pt-conflict">!</span>de permanence mais indisponible</span><span><span class="avail-badge">5</span>agents disponibles</span></div>';

// scheduleView : planning enregistré, ou aperçu en cours (S.preview). Indicateurs, tableau, alertes,
// charge par agent. Les listes de modification n'apparaissent qu'avec l'interrupteur « Administration »
// ET un aperçu ouvert.
function scheduleView(){
  const R=S.data.reglages, wes=shownWeekends(), year=shownYear(), editing=S.admin&&!!S.preview, asg=shownAsg(), perWk=perWeekend(), todayIso=C.today();
  const summary=C.analyze(S.data,asg,{today:todayIso,year:year}), emps=sortedAgents();
  const saved=S.data.planning.affectations, savedExists=hasSchedule();
  const exists=Object.keys(asg).some(function(c){return (asg[c]||[]).some(Boolean);});
  let modified={}, modCount=0;
  function asgKey(a){ return (a||[]).filter(Boolean).slice().sort().join(); }
  if(S.preview) wes.forEach(function(w){ if(asgKey(asg[w.key])!==asgKey(saved[w.key])){ modified[w.key]=true; modCount++; } });
  const savedSummary=S.preview&&savedExists?C.analyze(S.data,saved,{today:todayIso,year:year}):null;

  let h='<div class="head-section"><div><h2>Planning des permanences</h2><p class="help">'+
    (S.preview?'Aperçu non enregistré':S.data.planning.enregistreLe?'Enregistré le '+esc(dateTimeStr(S.data.planning.enregistreLe)):'Aucun planning enregistré pour l’instant')+'</p></div>'+
    '<div class="tools no-print">'+yearNav()+button('print','print','Imprimer / PDF','subtle')+'</div></div>';

  if(exists||S.preview){
    const longCount=wes.filter(function(w){return w.extended;}).length;
    h+='<div class="kpis">'+
      kpi('Écart de charge',inDays(summary.gap),savedSummary&&savedSummary.gap!==summary.gap?'avant : '+inDays(savedSummary.gap):'entre le plus et le moins sollicité',summary.gap<=2?'ok':summary.gap<=4?'warn':'danger')+
      kpi('Postes pourvus',summary.filled+' / '+summary.posts,summary.filled<summary.posts?(summary.posts-summary.filled)+' à pourvoir':'tous pourvus',summary.filled<summary.posts?'danger':'ok')+
      kpi('Alertes',String(summary.alerts.length),summary.alerts.length?'détail sous le tableau':'aucune',summary.alerts.length?'warn':'ok')+
      (S.preview&&savedExists?kpi('Week-ends modifiés',String(modCount),'par rapport au planning enregistré','accent'):kpi('Week-ends prolongés',String(longCount),'3 jours au lieu de 2',''))+
    '</div>';

  if(S.preview){
    h+='<div class="banner caution screen">'+ico('info')+'<div><b>Aperçu non enregistré</b>, visible uniquement par vous. '+esc(S.proposalInfo||'')+
      ' Les lignes marquées « modifié » diffèrent du planning enregistré. Une modification à la main verrouille le week-end. Les week-ends passés ne sont jamais modifiés par une proposition.</div></div>';
  }
  if(S.admin){
    h+='<div class="actions no-print">';

    if(S.preview){
      h+=button('save-schedule','check','Enregistrer le planning','pri');
      if(savedExists) h+=button('adjust','wand','Relancer l’ajustement','sec',{titre:'Repart du planning enregistré et ne change que le nécessaire'});
      h+=button('propose-full','sparkle','Nouvelle proposition complète','sec')+button('discard','x','Abandonner','danger');

         button('propose-full','sparkle','Nouvelle proposition complète','sec',{disabled:noAgent})+
         button('edit','edit','Modifier à la main','sec',{disabled:noAgent})+button('clear-schedule','trash','Effacer','danger');
    }else{
      h+=button('propose-full','sparkle','Proposer une répartition','pri',{disabled:noAgent})+button('edit','edit','Modifier à la main','sec',{disabled:noAgent});
    }
    h+='</div>';
    if(!S.preview&&savedExists) h+='<p class="help no-print" style="margin:-4px 0 14px">« Ajuster » garde le planning enregistré et ne change que le nécessaire : agents devenus indisponibles, postes vides, réduction de l’écart de charge (un nouvel agent prend sa part à compter de son arrivée). « Nouvelle proposition complète » recalcule tous les week-ends à venir non verrouillés.</p>';
  }else if(!exists){

  byMonth(wes).forEach(function(g){
    h+='<tr class="month-row"><th colspan="'+(editing?5:4)+'">'+esc(C.monthLabel(g.month))+'</th></tr>';
    g.wes.forEach(function(w){
      const a=asg[w.key]||[], past=w.key<=todayIso, isLocked=editing&&(past||!!S.preview.locks[w.key]), mine=S.employee&&a.indexOf(S.employee)>=0, isMod=!!modified[w.key];

          cell+='</select> ';
        }
      }else{
        const chips=a.filter(Boolean).map(function(id){ const n=nameOf(id); if(!n) return ''; return isUnavailable(id,w.key)&&!past?chip(n+' ⚠','alert','Indisponible ce week-end'):chip(n); }).filter(Boolean);
        cell=chips.length?'<div class="chips">'+chips.join('')+'</div>':'<span class="help">—</span>';
      }
      if(isMod){
        const prevNames=(saved[w.key]||[]).filter(Boolean).map(nameOf).filter(Boolean);
        cell+='<div class="previous">avant : '+(prevNames.length?'<s>'+esc(prevNames.join(', '))+'</s>':'non pourvu')+'</div>';
      }

      h+='<tr class="'+(past?'past ':'')+(isMod?'modified ':'')+(mine?'mine ':'')+(freeN<perWk&&!past?'unfilled':'')+'">'+
        '<td><div class="we-cell"><span class="we-label">'+esc(w.label)+'</span>'+(past?'<span class="tag tag-grey">passé</span>':'')+(isMod?'<span class="tag tag-accent">modifié</span>':'')+'</div></td>'+
        '<td>'+holidayTags(w)+(w.extended?' <span class="tag tag-grey" title="Jours de permanence de ce week-end (2 pour un week-end ordinaire)">'+w.days+' jours</span>':'')+'</td><td>'+cell+'</td><td class="num avail"><span class="avail-badge">'+freeN+'</span></td>'+
        (editing?'<td class="center no-print"><label class="lock-cb" title="'+(past?'Week-end passé : jamais modifié par une proposition':'Verrouiller : conservé par une nouvelle proposition')+'"><input type="checkbox" data-change="lock" data-we="'+w.key+'"'+(isLocked?' checked':'')+(past?' disabled':'')+' aria-label="Verrouiller '+esc(w.label)+'"></label></td>':'')+'</tr>';
    });

  h+='</tbody></table></div></div>';
  if(S.employee&&C.findEmployee(S.data,S.employee)) h+='<p class="help no-print" style="margin:-6px 0 16px">Les lignes surlignées sont les permanences de '+esc(nameOf(S.employee))+'.</p>';

  // Alertes
  if(exists){
    h+='<div class="card alerts-card"><h2>Alertes'+(year?' · '+year:'')+'</h2>';
    if(!summary.alerts.length) h+='<p class="ok-row">'+ico('check')+'Aucune alerte : tous les postes à venir sont pourvus, sans agent indisponible ni week-ends consécutifs.</p>';
    else{
      h+='<ul class="alerts">'; summary.alerts.forEach(function(x){ h+='<li class="'+x.type+'">'+ico('alert')+'<span>'+esc(x.msg)+'</span></li>'; }); h+='</ul>';
      if(!R.eviterConsecutifs && summary.alerts.some(function(x){return x.type==='consecutive';})) h+='<p class="help">L’option « éviter les week-ends consécutifs » est désactivée dans les réglages.</p>';
    }
    h+='</div>';
  }

  // Charge
  h+='<div class="card load-card"><h2>Charge par agent · '+esc(year?year:'toute la période')+'</h2>';
  if(!summary.stats.length) h+='<p class="help">Aucun agent.</p>';

    const mx=Math.max(summary.max,summary.goalMax,0.0001);
    h+='<div class="scroll"><table class="load"><thead><tr><th>Agent</th><th class="col-bar">Charge en jours <span style="text-transform:none;letter-spacing:0;font-weight:500">(trait = charge attendue)</span></th><th class="num" title="Jours de permanence effectués ou prévus">Effectué</th><th class="num" title="Nombre de jours que l’agent devrait faire pour une répartition équitable, compte tenu de sa date d’arrivée">Attendu</th><th class="num" title="Effectué moins attendu : positif = au-dessus de ce qui est attendu, négatif = en dessous">Écart</th><th class="num">Week-ends</th><th class="num">dont fériés</th><th class="num">Indispo.</th></tr></thead><tbody>';
    summary.stats.slice().sort(function(a,b){return b.workload-a.workload||a.name.localeCompare(b.name,'fr');}).forEach(function(s){
      const cls=exists&&summary.gap>0?(s.gap>=summary.gapMax-1e-9?'max':s.gap<=summary.gapMin+1e-9?'min':''):'';
      h+='<tr><td>'+chip(s.name)+'</td><td class="col-bar"><div class="bar-load"><span class="filled '+cls+'" style="width:'+(s.workload/mx*100).toFixed(1)+'%"></span><span class="average" style="left:'+(s.goal/mx*100).toFixed(1)+'%"></span></div></td>'+
        '<td class="num"><b>'+C.frNumber(s.workload)+'</b></td><td class="num">'+C.frNumber(s.goal)+'</td><td class="num">'+signedDays(s.gap)+'</td><td class="num">'+s.count+'</td><td class="num">'+s.holidayCount+'</td><td class="num">'+s.unavailableCount+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<p class="help" style="margin-top:.8rem"><b>Effectué</b> : jours de permanence de l’agent. <b>Attendu</b> : ce qu’il devrait faire pour une répartition équitable ; présent toute la période, c’est la moyenne ; arrivé en cours de période, seuls les week-ends après son arrivée comptent. <b>Écart</b> : effectué moins attendu.<br>Écart entre le plus et le moins sollicité : <b>'+inDays(summary.gap)+'</b>. Un week-end compte 2 jours, 3 s’il est prolongé par un férié le vendredi ou le lundi. Rouge : le plus sollicité ; vert : le moins sollicité.'+

  }
  h+='</div>';
  return h;
}

/* --- Propositions --- */
// runProposal : lance Core.propose (mode 'complete' ou 'adjust') et place le résultat dans
// S.preview. RIEN N'EST ÉCRIT dans le fichier à ce stade. Le calcul est différé de 30 ms pour laisser
// l'écran afficher « Calcul en cours… » ; il occupe ensuite la page 1,2 s environ (3,6 s au plus).
function runProposal(mode){
  if(S.computing) return;
  const saved=S.data.planning.affectations, todayIso=C.today();
  const base=S.preview?S.preview.assignments:saved;
  let locks={};
  if(S.preview) locks=S.preview.locks; else S.data.planning.verrous.forEach(function(c){locks[c]=true;});
  const before=C.analyze(S.data,saved,{today:todayIso});
  S.computing=mode; render();
  setTimeout(function(){
    try{
      const o={base:base,locks:Object.keys(locks).filter(function(c){return locks[c];}),durationMs:1200,today:todayIso};
      // Ajuster : le planning enregistré sert de référence, chaque changement est pénalisé.
      if(mode==='adjust') o.reference=saved;
      const r=C.propose(S.data,o), after=C.analyze(S.data,r.assignments,{today:todayIso});
      S.preview={assignments:r.assignments,locks:locks,mode:mode};
      S.proposalInfo=mode==='adjust'
        ?'Ajustement : '+plural(r.changes,'week-end')+' modifié'+(r.changes>1?'s':'')+', écart de charge '+inDays(before.gap)+' → '+inDays(after.gap)+'.'
        :'Proposition complète ('+r.attempts+' essais) : écart de charge '+inDays(after.gap)+'.';
      S.tab='schedule';
    }catch(e){ showError('Le calcul a échoué',e); }
    S.computing=false; render();
  },30);
}

/* --- Actions --- */
// actions : table des clics. La clé est la valeur de l'attribut data-action du bouton.
// Seules les actions suivantes modifient le fichier, toujours par execute() : toggle, add,
// rename (nom, arrivée), remove, save-settings, save-schedule, clear-schedule.
const actions={
  'tab':function(b){ S.tab=b.dataset.id; render(); window.scrollTo(0,0); },
  'open':openFolder,
  'reconnect':reconnect,
  'change-file':changeFolder,
  'reload':function(){ reload(true); },
  // toggle : pose ou retire une indisponibilité pour l'agent choisi dans la liste (S.employee).
  // Pas de contrôle d'identité ; le journal en garde la trace avec le rôle, sans nom d'auteur.
  'toggle':function(b){
    const we=b.dataset.we, id=S.employee; if(!C.findEmployee(S.data,id)) return;
    const val=(S.data.indispos[id]||[]).indexOf(we)<0;
    execute({type:'unavailable',employee:id,we:we,val:val});
  },
  'add':function(){
    const ta=document.getElementById('add-names'), names=C.splitNames(ta.value);
    if(!names.length){ ta.focus(); return; }
    const existing={}; S.data.salaries.forEach(function(s){existing[C.nameKey(s.nom)]=1;});
    const added=names.filter(function(n){return !existing[C.nameKey(n)];}), duplicates=names.length-added.length;
    ta.value='';
    if(duplicates) alert(plural(duplicates,'nom')+' déjà présent'+(duplicates>1?'s':'')+' : ignoré'+(duplicates>1?'s':'')+'.');
    if(added.length) execute({type:'addEmployees',employees:added.map(function(n){return {id:uid(),name:n};})});
  },
  'rename':function(b){
    const id=b.dataset.id, el=document.getElementById('name-'+id), fullName=el.value.trim().replace(/\s+/g,' ');
    if(!fullName){ alert('Le nom ne peut pas être vide.'); return; }
    if(S.data.salaries.some(function(s){return s.id!==id&&C.nameKey(s.nom)===C.nameKey(fullName);})){ alert('Ce nom est déjà utilisé.'); return; }
    // Date d'arrivée : contrôlée ici, puis de nouveau par Core.applyOp et Core.normalize.
    const elSince=document.getElementById('since-'+id), since=elSince.value||'';
    if(since&&!C.isValidIso(since)){ alert('La date d’arrivée est invalide.'); return; }
    const s=C.findEmployee(S.data,id); if(!s) return;
    const nameChanged=s.nom!==fullName, profileChanged=(s.depuis||'')!==since;
    el.value=fullName; el.defaultValue=fullName; elSince.defaultValue=since;
    if(nameChanged) execute({type:'rename',employee:id,name:fullName});
    if(profileChanged) execute({type:'profile',employee:id,since:since});
  },
  'remove':function(b){
    const id=b.dataset.id;
    if(!confirm('Retirer '+nameOf(id)+' ?\nSes indisponibilités seront supprimées et ses permanences libérées.\nLe détail (dates d’indisponibilité, permanences) est conservé dans le fichier permanences.log.')) return;
    if(S.preview) Object.keys(S.preview.assignments).forEach(function(c){ S.preview.assignments[c]=S.preview.assignments[c].map(function(x){return x===id?'':x;}); });
    execute({type:'remove',employee:id});
  },
  // save-settings : CONTRÔLE DES SAISIES avant écriture. Dates valides et ordonnées, 1 à 10 agents
  // par week-end, 20 ans au plus.
  'save-settings':function(){
    const v={
      titre:document.getElementById('setting-title').value.trim()||'Permanences du week-end',
      debut:document.getElementById('setting-start').value,
      fin:document.getElementById('setting-end').value,
      parWeekend:parseInt(document.getElementById('setting-per-weekend').value,10),
      eviterConsecutifs:document.getElementById('setting-consecutive').checked
    };
    if(!C.isValidIso(v.debut)||!C.isValidIso(v.fin)||v.debut>v.fin){ alert('Les dates de période sont invalides (la fin doit être après le début).'); return; }
    if(!(v.parWeekend>=1&&v.parWeekend<=10)){ alert('Le nombre d’agents par week-end doit être compris entre 1 et 10.'); return; }
    if(Number(v.fin.slice(0,4))-Number(v.debut.slice(0,4))>20){ alert('La période ne peut pas dépasser 20 ans.'); return; }
    document.querySelectorAll('[data-keep]').forEach(function(el){ el.defaultValue=el.value; });
    execute({type:'settings',values:v});
  },
  'propose-full':function(){ runProposal('complete'); },
  'adjust':function(){ runProposal('adjust'); },
  'edit':function(){
    const v={}; S.data.planning.verrous.forEach(function(c){v[c]=true;});
    S.preview={assignments:C.clone(S.data.planning.affectations),locks:v,mode:'manual'}; S.proposalInfo=''; render();
  },
  'discard':function(){ if(confirm('Abandonner l’aperçu ? Les modifications non enregistrées seront perdues.')){ S.preview=null; render(); } },
  // save-schedule : publie l'aperçu pour tous les postes. Demande confirmation s'il contient un agent
  // indisponible ou un doublon.
  'save-schedule':function(){
    const asg={}, a=S.preview.assignments;
    weekends().forEach(function(w){ asg[w.key]=(a[w.key]||[]).filter(Boolean); });
    const summary=C.analyze(S.data,asg,{today:C.today()}), severe=summary.alerts.filter(function(x){return x.type==='unavailable'||x.type==='duplicate';});
    if(severe.length&&!confirm('Attention :\n- '+severe.map(function(x){return x.msg;}).join('\n- ')+'\n\nEnregistrer quand même ?')) return;
    const locks=Object.keys(S.preview.locks).filter(function(c){return S.preview.locks[c];});
    S.preview=null;
    execute({type:'schedule',assignments:asg,locks:locks});
  },
  'clear-schedule':function(){ if(confirm('Effacer le planning enregistré pour tout le monde ?')) execute({type:'clearSchedule'}); },
  'print':function(){ printPage(); },
  'export-sheet':function(){
    const s=C.findEmployee(S.data,S.employee); if(!s) return;
    printSheets([s],'Indisponibilités - '+s.nom);
  },
  'year-nav':function(b){
    const ys=years(), i=ys.indexOf(shownYear())+Number(b.dataset.id);
    if(i>=0&&i<ys.length){ S.year=ys[i]; render(); }
  },
  'theme':function(b){
    S.theme=b.dataset.id; LS.set('theme',S.theme);
    if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme);
    render();
  },
  'backup':function(){ const n=new Date(), t=n.toISOString().slice(0,10)+'_'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0'); downloadFile('sauvegarde-permanences_'+t+'.json',C.serialize(S.data),'application/json'); },

};
// changes : table des événements « change » (cases, listes). Clé = attribut data-change.
// Aucune n'écrit dans le fichier : admin, year et employee changent l'affichage du poste ;
// assign et lock modifient l'aperçu local.
const changes={
  // admin : interrupteur « Administration ». Sans mot de passe : il n'ouvre aucun droit, il affiche
  // des onglets et des boutons. Son seul effet sur les données est le rôle inscrit dans le journal.
  'admin':function(el){
    S.admin=el.checked; LS.set('admin',S.admin);
    render();
  },
  'year':function(el){ S.year=el.value; render(); },
  'employee':function(el){
    S.employee=el.value; LS.set('employee',S.employee);
    render();
  },
  'assign':function(el){
    const we=el.dataset.we, s=+el.dataset.slot, a=(S.preview.assignments[we]||[]).slice();
    while(a.length<=s) a.push('');
    if(el.value&&a.indexOf(el.value)>=0&&a.indexOf(el.value)!==s){ alert('Cet agent est déjà affecté à ce week-end.'); render(); return; }
    a[s]=el.value; S.preview.assignments[we]=a; S.preview.locks[we]=true; render();
  },
  'lock':function(el){ S.preview.locks[el.dataset.we]=el.checked; render(); }
};
// Délégation d'événements : un seul écouteur par type. Une action inconnue ou un bouton désactivé est ignoré.
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-action]'); if(!b||b.disabled) return;
  const f=actions[b.dataset.action]; if(f){ e.preventDefault(); f(b,e); }
});
document.addEventListener('change',function(e){
  const el=e.target.closest('[data-change]'); if(!el) return;
  const f=changes[el.dataset.change]; if(f) f(el,e);
});
// Avertit avant de quitter la page si un aperçu n'est pas enregistré, ou si une saisie n'est pas encore
// écrite et revérifiée dans le fichier de données ou le journal (Store.busy). Edge affiche son propre
// message « Quitter le site ? » : le texte ne peut pas être personnalisé.
window.addEventListener('beforeunload',function(e){
  const busy=(S.store&&S.store.busy())||(S.logStore&&S.logStore.busy());
  if(S.preview||busy){ e.preventDefault(); e.returnValue=''; }
});

// Point de départ.
boot();
})();
</script>
</body>
